              <span>${z.flag}</span> ${z.name}
            </div>
            <div style="font-size:11px;color:var(--muted);">${z.city} (${z.tz.split('/')[1] || z.tz})</div>
          </div>
          <span style="font-size:18px;" title="${isDay ? 'Daytime' : 'Nighttime'}">${isDay ? '☀️' : '🌙'}</span>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:baseline;margin:4px 0;">
          <div style="font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:800;color:var(--text);letter-spacing:1px;">
            ${timeStr}
          </div>
          ${isBusinessHours ? `
            <span class="badge" style="background:rgba(34,197,94,0.15);color:var(--green);font-size:10px;font-weight:700;">
              ● BUSINESS HOURS
            </span>
          ` : `
            <span class="badge" style="background:var(--surface2);color:var(--muted);font-size:10px;">
              ○ Off Hours
            </span>
          `}
        </div>

        <div style="font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:6px;">
          <span>${dateStr}</span>
          <span style="font-family:'JetBrains Mono',monospace;">${z.tz}</span>
        </div>
      </div>
    `;
  }).join('');
}

function startWorldClockTicker() {
  if (worldClockTimer) clearInterval(worldClockTimer);
  worldClockTimer = setInterval(() => {
    if (currentAuditSubtab === 'worldclock' && worldClockReferenceHour === null) {
      const grid = document.getElementById('worldClockGrid');
      if (grid) grid.innerHTML = renderWorldClockCards();
    }
  }, 1000);
}

function handleWorldClockSlider(val) {
  worldClockReferenceHour = parseInt(val);
  const disp = document.getElementById('sliderHourDisplay');
  if (disp) disp.textContent = `${String(val).padStart(2, '0')}:00`;

function resetWorldClockToLive() {
  worldClockReferenceHour = null;

  if (disp) disp.textContent = `${String(new Date().getHours()).padStart(2, '0')}:00 (Live)`;
  const grid = document.getElementById('worldClockGrid');

  toast('World clock synced to live time');
}

let currentB64Mode = 'encode';

  runLiveHashCalc();

async function runLiveHashCalc() {
  const text = document.getElementById('cryptoHashTextInput')?.value || '';
  const algo = document.getElementById('cryptoHashAlgo')?.value || 'SHA-256';

  const labelEl = document.getElementById('cryptoHashLabel');
  if (labelEl) labelEl.textContent = `${algo} CHECKSUM`;

  let hash = '';
  try {
    if (algo === 'MD5') {
      hash = calcMD5(text);
    } else {
      const msgBuffer = new TextEncoder().encode(text);
      const hashBuffer = await crypto.subtle.digest(algo, msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      hash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {
    hash = 'Error: ' + e.message;
  }

  const outEl = document.getElementById('cryptoHashOutput');
  if (outEl) outEl.textContent = hash;
  verifyCryptoHashMatch();
}

async function handleCryptoFileUpload(file) {
  if (!file) return;
  const nameEl = document.getElementById('cryptoFileName');
  if (nameEl) nameEl.textContent = `Analyzing: ${file.name} (${(file.size / 1024).toFixed(1)} KB)...`;

  const algo = document.getElementById('cryptoHashAlgo')?.value || 'SHA-256';
  const labelEl = document.getElementById('cryptoHashLabel');
  if (labelEl) labelEl.textContent = `${algo} FILE CHECKSUM (${file.name})`;

  try {
    const arrayBuffer = await file.arrayBuffer();
    let hash = '';
    if (algo === 'MD5') {
      hash = calcMD5(new Uint8Array(arrayBuffer));
    } else {
      const hashBuffer = await crypto.subtle.digest(algo, arrayBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      hash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
    const outEl = document.getElementById('cryptoHashOutput');
    if (outEl) outEl.textContent = hash;
    if (nameEl) nameEl.textContent = `✓ ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
    verifyCryptoHashMatch();
    toast(`Computed ${algo} for ${file.name}!`);
  } catch (err) {
    toast('Error hashing file: ' + err.message);
  }
}

function decodeJwtToken() {
  const token = (document.getElementById('jwtTokenInput')?.value || '').trim();
  const headerEl = document.getElementById('jwtHeaderJson');
  const payloadEl = document.getElementById('jwtPayloadJson');
  const badge = document.getElementById('jwtStatusBadge');

  if (!token) {
    if (headerEl) headerEl.textContent = 'Paste token above to inspect';
    if (payloadEl) payloadEl.textContent = 'Paste token above to inspect';
    if (badge) badge.textContent = '';
    return;
  }

  const parts = token.split('.');
  if (parts.length !== 3) {
    if (headerEl) headerEl.textContent = 'Invalid JWT format (expected 3 dot-separated parts)';
    if (payloadEl) payloadEl.textContent = '';
    if (badge) {
      badge.style.color = 'var(--red)';
      badge.textContent = 'MALFORMED JWT';
    }
    return;
  }

  try {
    const headerStr = atob(parts[0].replace(/-/g, '+').replace(/_/g, '/'));
    const payloadStr = atob(parts[1].replace(/-/g, '+').replace(/_/g, '/'));
    const headerObj = JSON.parse(headerStr);
    const payloadObj = JSON.parse(payloadStr);

    if (headerEl) headerEl.textContent = JSON.stringify(headerObj, null, 2);
    if (payloadEl) payloadEl.textContent = JSON.stringify(payloadObj, null, 2);

    if (badge && payloadObj.exp) {
      const expMs = payloadObj.exp * 1000;
      const isExp = expMs < Date.now();
      const diffSec = Math.abs(Math.round((expMs - Date.now()) / 1000));
      const hours = Math.floor(diffSec / 3600);
      const mins = Math.floor((diffSec % 3600) / 60);

      if (isExp) {
        badge.style.color = 'var(--red)';
        badge.textContent = `EXPIRED (${hours}h ${mins}m ago)`;
      } else {
        badge.style.color = 'var(--green)';
        badge.textContent = `VALID (Expires in ${hours}h ${mins}m)`;
      }
    } else if (badge) {
      badge.style.color = 'var(--accent)';
      badge.textContent = 'NO EXPIRATION SET';
    }
  } catch (err) {
    if (headerEl) headerEl.textContent = 'Error parsing JWT base64: ' + err.message;
  }
}

function generateCryptoTokens() {
  const type = document.getElementById('tokenGenType')?.value || 'uuid';
  const outEl = document.getElementById('tokenGenOutput');
  if (!outEl) return;

  const tokens = [];
  for (let i = 0; i < 5; i++) {
    if (type === 'uuid') {
      tokens.push(crypto.randomUUID());
    } else if (type === 'nanoid') {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
      const arr = new Uint8Array(21);
      crypto.getRandomValues(arr);
      tokens.push(Array.from(arr).map(b => chars[b % chars.length]).join(''));
    } else if (type === 'hex32') {
      const arr = new Uint8Array(32);
      crypto.getRandomValues(arr);
      tokens.push(Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join(''));
    } else if (type === 'apikey') {
      const arr = new Uint8Array(24);
      crypto.getRandomValues(arr);
      tokens.push('vlt_live_' + Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join(''));
    } else if (type === 'hex16') {
      const arr = new Uint8Array(16);
      crypto.getRandomValues(arr);
      tokens.push(Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join(''));
    }
  }

  outEl.value = tokens.join('\n');
}

function analyzeEntropyInput() {
  const pwd = document.getElementById('entropyPwdInput')?.value || '';
  const bitsEl = document.getElementById('entropyBitsVal');
  const strengthEl = document.getElementById('entropyStrengthLevel');
  const poolValEl = document.getElementById('entropyPoolVal');
  const poolBreakEl = document.getElementById('entropyPoolBreakdown');
  const webEl = document.getElementById('crackWebVal');
  const gpuEl = document.getElementById('crackGpuVal');

  if (!pwd) {
    if (bitsEl) bitsEl.textContent = '0.0 bits';
    if (strengthEl) strengthEl.textContent = 'Empty';
    if (poolValEl) poolValEl.textContent = '0 chars (pool: 0)';
    if (poolBreakEl) poolBreakEl.textContent = 'No characters';
    if (webEl) webEl.textContent = 'Instant';
    if (gpuEl) gpuEl.textContent = 'Instant';
    return;
  }

  let poolSize = 0;
  const hasLower = /[a-z]/.test(pwd);
  const hasUpper = /[A-Z]/.test(pwd);
  const hasNum = /[0-9]/.test(pwd);
  const hasSym = /[^A-Za-z0-9]/.test(pwd);

  const parts = [];
  if (hasLower) { poolSize += 26; parts.push('a-z (26)'); }
  if (hasUpper) { poolSize += 26; parts.push('A-Z (26)'); }
  if (hasNum) { poolSize += 10; parts.push('0-9 (10)'); }
  if (hasSym) { poolSize += 33; parts.push('sym (33)'); }

  const bits = pwd.length * Math.log2(Math.max(poolSize, 1));
  const keyspace = Math.pow(poolSize, pwd.length);

  if (bitsEl) bitsEl.textContent = bits.toFixed(1) + ' bits';

  let strength = 'Very Weak';
  let color = 'var(--red)';
  if (bits >= 80) { strength = 'Military Grade (Unbreakable)'; color = 'var(--green)'; }
  else if (bits >= 60) { strength = 'Strong'; color = 'var(--green)'; }
  else if (bits >= 45) { strength = 'Moderate'; color = 'var(--orange)'; }
  else if (bits >= 28) { strength = 'Weak'; color = 'var(--orange)'; }

  if (strengthEl) {
    strengthEl.textContent = strength;
    strengthEl.style.color = color;
  }

  if (poolValEl) poolValEl.textContent = `${pwd.length} chars (pool: ${poolSize})`;
  if (poolBreakEl) poolBreakEl.textContent = parts.join(' + ');

  const webSec = keyspace / 2 / 10;
  const gpuSec = keyspace / 2 / 10000000000;

  const formatSec = (sec) => {
    if (sec < 1) return 'Instant (<1s)';
    if (sec < 60) return `${Math.round(sec)} seconds`;
    if (sec < 3600) return `${Math.round(sec / 60)} minutes`;
    if (sec < 86400) return `${Math.round(sec / 3600)} hours`;
    if (sec < 31536000) return `${Math.round(sec / 86400)} days`;
    if (sec < 31536000 * 100) return `${Math.round(sec / 31536000)} years`;
    if (sec < 31536000 * 1000000) return `${Math.round(sec / (31536000 * 1000))}k centuries`;
    return 'Millions of Years';
  };

  if (webEl) webEl.textContent = formatSec(webSec);
  if (gpuEl) gpuEl.textContent = formatSec(gpuSec);
}

// Pure JS MD5 Checksum Implementation (Zero external dependencies)
function calcMD5(input) {
  let bytes;
  if (typeof input === 'string') {
    bytes = new TextEncoder().encode(input);
  } else {
    bytes = input;
  }

  function r(A, B) { return (A << B) | (A >>> (32 - B)); }
  function add(x, y) {
    const lsw = (x & 0xFFFF) + (y & 0xFFFF);
    const msw = (x >> 16) + (y >> 16) + (lsw >> 16);
    return (msw << 16) | (lsw & 0xFFFF);
  }

  let l = bytes.length;
  let words = [];
  for (let i = 0; i < l; i++) {
    words[i >> 2] |= (bytes[i] & 0xFF) << ((i % 4) * 8);
  }
  words[l >> 2] |= 0x80 << ((l % 4) * 8);
  words[(((l + 8) >> 6) << 4) + 14] = l * 8;

  let a = 1732584193, b = -271733879, c = -1732584194, d = 271733878;

  for (let i = 0; i < words.length; i += 16) {
    let [aa, bb, cc, dd] = [a, b, c, d];
    const F = (X, Y, Z) => (X & Y) | (~X & Z);
    const G = (X, Y, Z) => (X & Z) | (Y & ~Z);
    const H = (X, Y, Z) => X ^ Y ^ Z;
    const I = (X, Y, Z) => Y ^ (X | ~Z);

    const step = (f, q, w, e, r_, k, s, t) => add(w, r(add(add(q, f(w, e, r_)), add(k, t)), s));

    a = step(F, a, b, c, d, words[i+0]||0, 7, -680876936);
    d = step(F, d, a, b, c, words[i+1]||0, 12, -389564586);
    c = step(F, c, d, a, b, words[i+2]||0, 17, 606105819);
    b = step(F, b, c, d, a, words[i+3]||0, 22, -1044525330);
    a = step(F, a, b, c, d, words[i+4]||0, 7, -176418897);
    d = step(F, d, a, b, c, words[i+5]||0, 12, 1200080426);
    c = step(F, c, d, a, b, words[i+6]||0, 17, -1473231341);
    b = step(F, b, c, d, a, words[i+7]||0, 22, -45705983);
    a = step(F, a, b, c, d, words[i+8]||0, 7, 1770035416);
    d = step(F, d, a, b, c, words[i+9]||0, 12, -1958414417);
    c = step(F, c, d, a, b, words[i+10]||0, 17, -42063);
    b = step(F, b, c, d, a, words[i+11]||0, 22, -1990404162);
    a = step(F, a, b, c, d, words[i+12]||0, 7, 1804603682);
    d = step(F, d, a, b, c, words[i+13]||0, 12, -40341101);
    c = step(F, c, d, a, b, words[i+14]||0, 17, -1502002290);
    b = step(F, b, c, d, a, words[i+15]||0, 22, 1236535329);

    a = step(G, a, b, c, d, words[i+1]||0, 5, -165796510);
    d = step(G, d, a, b, c, words[i+6]||0, 9, -1069501632);
    c = step(G, c, d, a, b, words[i+11]||0, 14, 643717713);
    b = step(G, b, c, d, a, words[i+0]||0, 20, -373897302);
    a = step(G, a, b, c, d, words[i+5]||0, 5, -701558691);
    d = step(G, d, a, b, c, words[i+10]||0, 9, 38016083);
    c = step(G, c, d, a, b, words[i+15]||0, 14, -660478335);
    b = step(G, b, c, d, a, words[i+4]||0, 20, -405537848);
    a = step(G, a, b, c, d, words[i+9]||0, 5, 568446438);
    d = step(G, d, a, b, c, words[i+14]||0, 9, -1019803690);
    c = step(G, c, d, a, b, words[i+3]||0, 14, -187363961);
    b = step(G, b, c, d, a, words[i+8]||0, 20, 1163531501);
    a = step(G, a, b, c, d, words[i+13]||0, 5, -1444681467);
    d = step(G, d, a, b, c, words[i+2]||0, 9, -51403784);
    c = step(G, c, d, a, b, words[i+7]||0, 14, 1735328473);
    b = step(G, b, c, d, a, words[i+12]||0, 20, -1926607734);

    a = step(H, a, b, c, d, words[i+5]||0, 4, -378558);
    d = step(H, d, a, b, c, words[i+8]||0, 11, -2022574463);
    c = step(H, c, d, a, b, words[i+11]||0, 16, 1839030562);
    b = step(H, b, c, d, a, words[i+14]||0, 23, -35309556);
    a = step(H, a, b, c, d, words[i+1]||0, 4, -1530992060);
    d = step(H, d, a, b, c, words[i+4]||0, 11, 1272893353);
    c = step(H, c, d, a, b, words[i+7]||0, 16, -155497632);
    b = step(H, b, c, d, a, words[i+10]||0, 23, -1094730640);
    a = step(H, a, b, c, d, words[i+13]||0, 4, 681279174);
    d = step(H, d, a, b, c, words[i+0]||0, 11, -358537222);
    c = step(H, c, d, a, b, words[i+3]||0, 16, -722521979);
    b = step(H, b, c, d, a, words[i+6]||0, 23, 76029189);
    a = step(H, a, b, c, d, words[i+9]||0, 4, -640364487);
    d = step(H, d, a, b, c, words[i+12]||0, 11, -421815835);
    c = step(H, c, d, a, b, words[i+15]||0, 16, 530742520);
    b = step(H, b, c, d, a, words[i+2]||0, 23, -995338651);

    a = step(I, a, b, c, d, words[i+0]||0, 6, -198630844);
    d = step(I, d, a, b, c, words[i+7]||0, 10, 1126891415);
    c = step(I, c, d, a, b, words[i+14]||0, 15, -1416354905);
    b = step(I, b, c, d, a, words[i+5]||0, 21, -57434055);
    a = step(I, a, b, c, d, words[i+12]||0, 6, 1700485571);
    d = step(I, d, a, b, c, words[i+3]||0, 10, -1894986606);
    c = step(I, c, d, a, b, words[i+10]||0, 15, -1051523);
    b = step(I, b, c, d, a, words[i+1]||0, 21, -2054922799);
    a = step(I, a, b, c, d, words[i+8]||0, 6, 1873313359);
    d = step(I, d, a, b, c, words[i+15]||0, 10, -30611744);
    c = step(I, c, d, a, b, words[i+6]||0, 15, -1560198380);
    b = step(I, b, c, d, a, words[i+13]||0, 21, 1309151649);
    a = step(I, a, b, c, d, words[i+4]||0, 6, -145523070);
    d = step(I, d, a, b, c, words[i+11]||0, 10, -1120210379);
    c = step(I, c, d, a, b, words[i+2]||0, 15, 718787259);
    b = step(I, b, c, d, a, words[i+9]||0, 21, -343485551);

    a = add(a, aa);
    b = add(b, bb);
    c = add(c, cc);
    d = add(d, dd);
  }

  const toHex = n => {
    let s = '';
    for (let i = 0; i < 4; i++) {
      s += ((n >> (i * 8)) & 0xFF).toString(16).padStart(2, '0');
    }
    return s;
  };

  return toHex(a) + toHex(b) + toHex(c) + toHex(d);
}

async function fetchAiConfig() {
  try {
    aiConfig = await api('GET', '/ai/config');
    if (aiConfig.preferredProvider) currentAiProvider = aiConfig.preferredProvider;
    if (aiConfig.preferredModel) currentAiModel = aiConfig.preferredModel;
  } catch(e) {
    console.warn('AI config fetch error:', e);
  }
}

async function onAiProviderChange(prov) {
  currentAiProvider = prov;
  const models = AI_MODEL_OPTIONS[prov] || AI_MODEL_OPTIONS.auto;
  currentAiModel = models[0]?.id || 'auto';
  
  // Save preference
  try {
    await api('POST', '/ai/preferences', { provider: currentAiProvider, model: currentAiModel });
  } catch(_) {}

  renderAssistant();
}

async function onAiModelChange(model) {
  currentAiModel = model;
  try {
    await api('POST', '/ai/preferences', { provider: currentAiProvider, model: currentAiModel });
  } catch(_) {}
}

function toggleKeyVisibility(prov) {
  const input = document.getElementById(`key-${prov}`);
  if (!input) return;
  input.type = input.type === 'password' ? 'text' : 'password';
}

async function testAiProviderKey(provider) {
  const statusEl = document.getElementById(`test-status-${provider}`);
  const btnEl = document.getElementById(`btn-test-${provider}`);
  const inputVal = document.getElementById(`key-${provider}`)?.value.trim();

  if (statusEl) {
    statusEl.innerHTML = '<span class="ai-test-status testing">⏳ Testing connection & model access…</span>';
  }
  if (btnEl) btnEl.disabled = true;

  try {
    const res = await api('POST', '/ai/test', {
      provider,
      apiKey: inputVal || undefined
    });

    if (res.success) {
      if (statusEl) {
        statusEl.innerHTML = `<span class="ai-test-status ok">✅ Verified Active (${res.latencyMs || 0}ms latency)</span>`;
      }
      toast(`✓ ${provider.toUpperCase()} key is verified & operational! (${res.latencyMs || 0}ms)`);
      playNotificationChime();
    } else {
      if (statusEl) {
        statusEl.innerHTML = `<span class="ai-test-status fail">❌ ${esc(res.error || 'Connection failed')}</span>`;
      }
      toast(`✕ ${provider} test error: ${res.error || 'Failed'}`);
    }
  } catch (err) {
    if (statusEl) {
      statusEl.innerHTML = `<span class="ai-test-status fail">❌ ${esc(err.message)}</span>`;
    }
    toast(`✕ ${provider} test request error: ${err.message}`);
  } finally {
    if (btnEl) btnEl.disabled = false;
  }
}

async function saveSingleAiKey(provider) {
  const input = document.getElementById(`key-${provider}`);
  const key = input?.value.trim();
  if (!key) return toast('Please enter an API key first');

  try {
    await api('POST', '/ai/keys', { [provider]: key });
    toast(`✓ ${provider.toUpperCase()} key saved to secure vault!`);
    await fetchAiConfig();
    openAiSettingsModal(); // Refresh modal with updated badges
    renderAssistant();
  } catch (err) {
    toast('Error saving key: ' + err.message);
  }
}

async function removeAiKey(provider) {
  if (!confirm(`Remove stored API key for ${provider.toUpperCase()}?`)) return;
  try {
    await api('POST', '/ai/keys', { [provider]: '' });
    toast(`Stored ${provider.toUpperCase()} key cleared`);
    await fetchAiConfig();
    openAiSettingsModal();
    renderAssistant();
  } catch (err) {
    toast('Error clearing key: ' + err.message);
  }
}

async function openGlobalSettingsModal(category = 'all') {
  currentSettingsCategory = category || 'all';

  document.getElementById('modalContent').innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>

      Loading configured API keys and endpoint settings...
    </div>
    <div style="text-align:center;padding:36px;color:var(--accent);">⚡ Loading Vault Settings...</div>

  openModal();

  try {

    if (res && res.success) {
      allGlobalSettingsCache = res;

    } else {
      document.getElementById('modalContent').innerHTML = `

      <div class="modal-title">⚙️ Global Settings</div>
      <div style="color:var(--red);padding:20px;">Failed to load settings: ${esc(err.message)}</div>

function setGlobalSettingsCategory(catId) {

  renderGlobalSettingsContent();
}

function toggleGlobalKeyVisibility(keyId) {
  const el = document.getElementById('setting-input-' + keyId);
  if (el) el.type = el.type === 'password' ? 'text' : 'password';
}

async function testGlobalSettingKey(keyId, provider) {
  const input = document.getElementById('setting-input-' + keyId);
  const val = input ? input.value.trim() : '';
  const statusEl = document.getElementById('setting-status-' + keyId);
  const btn = document.getElementById('btn-test-' + keyId);

  if (statusEl) {
    statusEl.innerHTML = `<span style="color:var(--orange);">⚡ Verifying credentials with ${esc(provider)}...</span>`;
  }
  if (btn) btn.disabled = true;

  try {
    const res = await api('POST', '/settings/test', { key: keyId, value: val, provider: provider });
    if (res && res.success) {
      if (statusEl) {
        statusEl.innerHTML = `<span style="color:var(--green);font-weight:600;">✓ ${esc(res.message)}</span>`;
      }
      toast(`✓ ${keyId} test passed!`);
    } else {
      if (statusEl) {
        statusEl.innerHTML = `<span style="color:var(--red);font-weight:600;">✕ ${esc(res?.error || 'Validation failed')}</span>`;
      }
    }
  } catch (err) {
    if (statusEl) {
      statusEl.innerHTML = `<span style="color:var(--red);">✕ Test failed: ${esc(err.message)}</span>`;
    }
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function saveSingleGlobalSetting(keyId, explicitVal) {
  let val = explicitVal;
  if (val === undefined) {
    const el = document.getElementById('setting-input-' + keyId);
    val = el ? el.value.trim() : '';
  }

  if (val === undefined || val === '') {
    return toast('Please enter a value before saving.');
  }

  try {
    await api('POST', '/settings/save', { settings: { [keyId]: val } });
    toast(`✓ Setting "${keyId}" saved to vault!`);
    await fetchAiConfig();
    await openGlobalSettingsModal(currentSettingsCategory);
  } catch (err) {
    toast('Failed to save setting: ' + err.message);
  }
}

async function removeGlobalSetting(keyId) {
  if (!confirm(`Are you sure you want to remove ${keyId}?`)) return;
  try {
    await api('POST', '/settings/save', { settings: { [keyId]: '' } });
    toast(`✓ ${keyId} cleared`);
    await fetchAiConfig();
    await openGlobalSettingsModal(currentSettingsCategory);
  } catch (err) {
    toast('Error removing setting: ' + err.message);
  }
}

async function saveAllGlobalSettings() {
  if (!allGlobalSettingsCache) return closeModal();
  const settingsToSave = {};

  allGlobalSettingsCache.categories.forEach(cat => {
    cat.keys.forEach(k => {
      const el = document.getElementById('setting-input-' + k.id);
      if (el && el.value.trim() !== '') {
        settingsToSave[k.id] = el.value.trim();
      }
    });
  });

  if (Object.keys(settingsToSave).length === 0) {
    toast('No new key values entered to save.');
    closeModal();
    return;
  }

  try {
    const res = await api('POST', '/settings/save', { settings: settingsToSave });
    toast(`✓ Saved ${res?.updatedCount || Object.keys(settingsToSave).length} settings successfully!`);
    await fetchAiConfig();
    closeModal();
  } catch (err) {
    toast('Error saving settings: ' + err.message);
  }
}

async function saveAiKeys() {
  await saveAllGlobalSettings();
}

function switchInternetSubtab(tab) {
  currentInternetSubtab = tab;
  document.querySelectorAll('.internet-subnav .settings-cat-pill').forEach((btn) => {
    if (btn.getAttribute('data-subtab') === tab) btn.classList.add('active');
    else btn.classList.remove('active');
  });
  renderCurrentInternetSubtab();
}

function renderCurrentInternetSubtab() {
  const container = document.getElementById('internetSubtabContent');
  if (!container) return;

  if (currentInternetSubtab === 'search') {
    renderWebSearchSubtab(container);
  } else if (currentInternetSubtab === 'scraper') {
    renderNetworkScraperSubtab(container);
  } else if (currentInternetSubtab === 'netping') {
    renderNetworkPingSubtab(container);
  } else if (currentInternetSubtab === 'map') {
    renderMapSubtab(container);
  } else if (currentInternetSubtab === 'bestfood') {
    renderBestFoodSubtab(container);
  } else if (currentInternetSubtab === 'weather') {
    renderWeatherSubtab(container);
  } else if (currentInternetSubtab === 'exchange') {
    renderForexSubtab(container);
  } else if (currentInternetSubtab === 'hackernews') {
    renderHackerNewsSubtab(container);
  } else if (currentInternetSubtab === 'dns') {
    renderDnsSubtab(container);
  } else if (currentInternetSubtab === 'ainews') {
    if (typeof window.renderAiNewsAppsTab === 'function') {
      window.renderAiNewsAppsTab('news');
    }
  } else if (currentInternetSubtab === 'trendingapps') {
    if (typeof window.renderAiNewsAppsTab === 'function') {
      window.renderAiNewsAppsTab('apps');
    }
  }
}

function selectSearchEngine(eng) {
  currentSearchEngine = eng;
  renderCurrentInternetSubtab();
  if (internetSearchQuery) {
    executeInternetSearch();
  }
}

function onGoogleSuggestInput(val) {
  internetSearchQuery = val;
  clearTimeout(googleSuggestTimeout);
  if (!val.trim() || val.trim().length < 2) {
    googleSuggestionsList = [];
    return;
  }
  googleSuggestTimeout = setTimeout(async () => {
    try {
      const res = await api('GET', `/web/google-suggest?q=${encodeURIComponent(val.trim())}`);
      if (res && res.success && Array.isArray(res.suggestions)) {
        googleSuggestionsList = res.suggestions;
        const container = document.getElementById('internetSubtabContent');
        if (container && currentInternetSubtab === 'search') {
          renderWebSearchSubtab(container);
          const inp = document.getElementById('internetSearchInput');
          if (inp) {
            inp.focus();
            inp.setSelectionRange(inp.value.length, inp.value.length);
          }
        }
      }
    } catch (_) {}
  }, 250);
}

function openDirectGoogleSearch() {
  const input = document.getElementById('internetSearchInput');
  const q = input ? input.value.trim() : internetSearchQuery;
  const target = q ? `https://www.google.com/search?q=${encodeURIComponent(q)}` : 'https://www.google.com';
  window.open(target, '_blank');
}

function quickSearchInternet(q) {
  internetSearchQuery = q;
  const input = document.getElementById('internetSearchInput');
  if (input) input.value = q;
  executeInternetSearch();
}

async function executeInternetSearch() {
  const input = document.getElementById('internetSearchInput');
  const q = input ? input.value.trim() : internetSearchQuery;
  if (!q) return toast('Please enter a search query');
  internetSearchQuery = q;
  isSearchingInternet = true;
  renderCurrentInternetSubtab();

  try {
    const res = await api('GET', `/web/search?q=${encodeURIComponent(q)}&engine=${encodeURIComponent(currentSearchEngine)}`);
    if (res && res.success) {
      internetSearchResults = res.results || [];
      currentSearchProvider = res.provider || 'DuckDuckGo';
      if (res.googleSuggestions && res.googleSuggestions.length) {
        googleSuggestionsList = res.googleSuggestions;
      }
    } else {
      toast('Search failed: ' + (res?.error || 'Unknown error'));
      internetSearchResults = [];
    }
  } catch (err) {
    toast('Search error: ' + err.message);
    internetSearchResults = [];
  } finally {
    isSearchingInternet = false;
    renderCurrentInternetSubtab();
  }
}

function quickDeepScrape(url) {
  switchInternetSubtab('scraper');
  internetScrapeUrl = url;
  setTimeout(() => {
    const input = document.getElementById('networkScrapeUrlInput');
    if (input) input.value = url;
    executeNetworkScraper();
  }, 60);
}

function quickScrapePreset(url) {
  internetScrapeUrl = url;
  const input = document.getElementById('networkScrapeUrlInput');
  if (input) input.value = url;
  executeNetworkScraper();
}

async function executeNetworkScraper() {
  const input = document.getElementById('networkScrapeUrlInput');
  const url = input ? input.value.trim() : internetScrapeUrl;
  if (!url) return toast('Please enter a website URL');
  internetScrapeUrl = url;
  isNetworkScraping = true;
  renderCurrentInternetSubtab();

  try {
    const res = await api('POST', '/web/network-scrape', { url });
    if (res && res.success) {
      networkScrapeData = res;
      scrapedPageData = {
        title: res.meta?.title,
        url: res.finalUrl,
        author: res.meta?.author,
        description: res.meta?.description,
        wordCount: res.content?.wordCount,
        readingTime: res.content?.readingTime,
        markdown: res.content?.markdown
      };
      toast(`✓ Scraped "${res.domain}" (${res.timing?.latencyMs}ms TTFB, Grade ${res.security?.grade})!`);
    } else {
      toast('Network scrape failed: ' + (res?.error || 'Unknown error'));
    }
  } catch (err) {
    toast('Network scrape error: ' + err.message);
  } finally {
    isNetworkScraping = false;
    renderCurrentInternetSubtab();
  }
}

function downloadScrapedMarkdown() {
  if (!networkScrapeData || !networkScrapeData.content?.markdown) return toast('No content to download');
  const blob = new Blob([networkScrapeData.content.markdown], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${networkScrapeData.domain || 'scraped'}-${Date.now()}.md`;
  a.click();
  toast('✓ Downloaded markdown file!');
}

function copyScrapedMarkdown() {
  const md = networkScrapeData?.content?.markdown || scrapedPageData?.markdown;
  if (!md) return toast('No content to copy');
  copyText(md);
  toast('✓ Clean Markdown copied to clipboard!');
}

async function saveScrapedToVaultDrive() {
  const md = networkScrapeData?.content?.markdown || scrapedPageData?.markdown;
  const title = (networkScrapeData?.meta?.title || scrapedPageData?.title || 'article').toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 35);
  if (!md) return toast('No content to save');
  const filename = `${title}-${Date.now().toString().slice(-4)}.md`;

  try {
    const encoder = new TextEncoder();
    const data = encoder.encode(md);
    let binary = '';
    for (let i = 0; i < data.length; i++) binary += String.fromCharCode(data[i]);
    const base64Content = btoa(binary);

    await api('POST', '/uploads', {
      filename,
      content: base64Content,
      mime_type: 'text/markdown',
      item_type: 'file',
      item_id: 0
    });
    toast(`✓ Saved "${filename}" to Vault Drive!`);
  } catch (err) {
    toast('Error saving to Drive: ' + err.message);
  }
}

function summarizeScrapedWithCopilot() {
  const md = networkScrapeData?.content?.markdown || scrapedPageData?.markdown;
  const title = networkScrapeData?.meta?.title || scrapedPageData?.title || 'Article';
  const url = networkScrapeData?.finalUrl || scrapedPageData?.url || '';
  if (!md) return;

  const excerpt = md.slice(0, 3000);
  switchTab('assistant');
  setTimeout(() => {
    const input = document.getElementById('chatInput');
    if (input) {
      input.value = `Here is an article I extracted with Network Scraper:\nTitle: ${title}\nURL: ${url}\n\nContent:\n${excerpt}\n\nPlease provide a clear executive summary and 5 key action points.`;
      input.focus();
    }
  }, 100);
}

function quickPingPreset(host) {

async function executeNetworkPing() {
  const input = document.getElementById('pingHostInput');
  const target = input ? input.value.trim() : pingHostTarget;
  if (!target) return toast('Please enter a host or domain');
  pingHostTarget = target;
  isPinging = true;
  renderCurrentInternetSubtab();

  try {
    const res = await api('GET', `/network/ping?host=${encodeURIComponent(target)}`);
    if (res && res.success) {
      pingResultData = res;
      toast(`✓ ${target} reached in ${res.latencyMs}ms!`);
    } else {
      pingResultData = { target, reachable: false, error: res?.error || 'Unreachable' };
      toast('Ping failed: ' + (res?.error || 'Host unreachable'));
    }
  } catch (err) {
    toast('Ping error: ' + err.message);
  } finally {
    isPinging = false;
    renderCurrentInternetSubtab();
  }
}

  const input = document.getElementById('pingHostInput');

function toggleBestFoodCardExpansion(foodId) {
  bestFoodsExpandedCards[foodId] = !bestFoodsExpandedCards[foodId];
  renderCurrentInternetSubtab();
}

async function openBestFoodRecipes(food) {
  bestFoodsActiveRecipeFood = food;
  bestFoodsRecipesLoading = true;
  bestFoodsRecipesList = [];
  renderCurrentInternetSubtab();

  try {
    const query = food.name.split(' ')[0].replace(/[^a-zA-Z]/g, '') || food.name;
    const res = await api('GET', `/public/best-foods/recipes?food=${encodeURIComponent(query)}`);
    if (res && res.success) {
      bestFoodsRecipesList = res.recipes || [];
    } else {
      toast('Could not fetch recipes: ' + (res?.error || 'Unknown'));
    }
  } catch (err) {
    toast('Recipe fetch error: ' + err.message);
  } finally {
    bestFoodsRecipesLoading = false;
    renderCurrentInternetSubtab();
  }
}

function closeBestFoodRecipes() {
  bestFoodsActiveRecipeFood = null;
  bestFoodsRecipesList = [];
  renderCurrentInternetSubtab();
}

function openBestFoodProtocolModal() {
  bestFoodsProtocolModalOpen = true;
  renderCurrentInternetSubtab();
}

function closeBestFoodProtocolModal() {
  bestFoodsProtocolModalOpen = false;
  renderCurrentInternetSubtab();
}

async function generatePersonalizedProtocol() {
  bestFoodsProtocolLoading = true;
  renderCurrentInternetSubtab();

  try {
    const allergensArr = bestFoodsUserAllergens.split(',').map(s => s.trim()).filter(Boolean);
    const res = await api('POST', '/public/best-foods/recommend', {
      goals: bestFoodsSelectedGoals,
      diet: bestFoodsUserDiet,
      allergens: allergensArr
    });

    if (res && res.success) {
      bestFoodsProtocolResult = res;
      toast('Generated personalized superfood protocol!');
    } else {
      toast('Protocol generation failed: ' + (res?.error || 'Failed'));
    }
  } catch (err) {
    toast('Error generating protocol: ' + err.message);
  } finally {
    bestFoodsProtocolLoading = false;
    renderCurrentInternetSubtab();
  }
}

function toggleProtocolGoal(goalId) {
  if (bestFoodsSelectedGoals.includes(goalId)) {
    if (bestFoodsSelectedGoals.length > 1) {
      bestFoodsSelectedGoals = bestFoodsSelectedGoals.filter(g => g !== goalId);
    } else {
      toast('Select at least one health goal');
    }
  } else {
    bestFoodsSelectedGoals.push(goalId);
  }
  renderCurrentInternetSubtab();
}

function initLeafletMapInstance(containerId, initialCenter = [40.7128, -74.0060], initialZoom = 12) {
  if (typeof L === 'undefined') {
    const el = document.getElementById(containerId);
    if (el) el.innerHTML = '<div style="color:var(--accent);text-align:center;padding:80px 20px;font-weight:600;">Loading Leaflet Map Engine...</div>';
    setTimeout(() => initLeafletMapInstance(containerId, initialCenter, initialZoom), 200);
    return;
  }

  if (vaultMapInstance) {
    try {
      vaultMapInstance.remove();
    } catch (_) {}
    vaultMapInstance = null;
  }

  const container = document.getElementById(containerId);
  if (!container) return;

  vaultMapInstance = L.map(containerId, {
    center: initialCenter,
    zoom: initialZoom,
    zoomControl: true,
    attributionControl: true
  });

  switchMapTileLayer(vaultMapCurrentTileType);
  L.control.scale({ imperial: true, metric: true, position: 'bottomleft' }).addTo(vaultMapInstance);

  vaultMapInstance.on('click', async (e) => {
    const { lat, lng } = e.latlng;
    if (isMapMeasureMode) {
      addMapMeasurePoint(lat, lng);
      return;
    }
    dropMapMarker(lat, lng, true);
  });

  vaultMapInstance.on('move', () => {
    updateMapHud();
  });

  renderSavedPinsOnMap();
  loadMapPinsFromDatabase();
  updateMapHud();

  setTimeout(() => {
    if (vaultMapInstance) vaultMapInstance.invalidateSize();
  }, 150);
}

function getHaversineDistanceKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function addMapMeasurePoint(lat, lng) {
  if (!vaultMapInstance || typeof L === 'undefined') return;
  mapMeasurePoints.push([lat, lng]);
  const ptNum = mapMeasurePoints.length;

  const pinIcon = L.divIcon({
    html: `<div class="measure-point-pin">${ptNum}</div>`,
    className: 'custom-measure-pin',
    iconSize: [22, 22],
    iconAnchor: [11, 11]
  });

  const marker = L.marker([lat, lng], { icon: pinIcon }).addTo(vaultMapInstance);
  mapMeasureMarkers.push(marker);

  if (mapMeasurePoints.length > 1) {
    if (mapMeasurePolyline) {
      mapMeasurePolyline.setLatLngs(mapMeasurePoints);
    } else {
      mapMeasurePolyline = L.polyline(mapMeasurePoints, {
        color: '#f59e0b',
        weight: 4,
        dashArray: '8, 8',
        opacity: 0.9
      }).addTo(vaultMapInstance);
    }

    let total = 0;
    for (let i = 0; i < mapMeasurePoints.length - 1; i++) {
      const p1 = mapMeasurePoints[i];
      const p2 = mapMeasurePoints[i+1];
      total += getHaversineDistanceKm(p1[0], p1[1], p2[0], p2[1]);
    }
    mapMeasureTotalKm = total;
  }

  const hudStats = document.getElementById('measureHudStats');
  if (hudStats) {
    hudStats.textContent = `${mapMeasureTotalKm.toFixed(2)} km (${(mapMeasureTotalKm * 0.621371).toFixed(2)} miles) • ${mapMeasurePoints.length} points`;
  }
}

function clearMapMeasure() {
  if (vaultMapInstance && typeof L !== 'undefined') {
    if (mapMeasurePolyline) {
      try { vaultMapInstance.removeLayer(mapMeasurePolyline); } catch (_) {}
      mapMeasurePolyline = null;
    }
    mapMeasureMarkers.forEach(m => {
      try { vaultMapInstance.removeLayer(m); } catch (_) {}
    });
  }
  mapMeasureMarkers = [];
  mapMeasurePoints = [];
  mapMeasureTotalKm = 0;

  const hudStats = document.getElementById('measureHudStats');
  if (hudStats) {
    hudStats.textContent = 'Click on map to place 1st & 2nd points';
  }
  toast('Measurement path cleared');
}

function switchMapTileLayer(tileType) {
  vaultMapCurrentTileType = tileType;
  if (!vaultMapInstance || typeof L === 'undefined') return;

  if (vaultMapCurrentTileLayer) {
    try { vaultMapInstance.removeLayer(vaultMapCurrentTileLayer); } catch (_) {}
  }

  const provider = VAULT_MAP_TILE_PROVIDERS[tileType] || VAULT_MAP_TILE_PROVIDERS.dark;
  vaultMapCurrentTileLayer = L.tileLayer(provider.url, provider.options).addTo(vaultMapInstance);

  document.querySelectorAll('.map-layer-pill').forEach(btn => {
    if (btn.getAttribute('data-layer') === tileType) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  });
}

async function dropMapMarker(lat, lng, shouldReverseGeocode = true, customTitle = null) {
  if (!vaultMapInstance || typeof L === 'undefined') return;

  const marker = L.marker([lat, lng]).addTo(vaultMapInstance);
  vaultMapMarkers.push(marker);

  const coordsText = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  let title = customTitle || `Pin @ ${coordsText}`;
  let address = 'Loading address details...';

  const getPopupContent = (t, a) => `
    <div style="min-width:200px;max-width:280px;padding:4px 0;">
      <div style="font-weight:700;font-size:14px;color:var(--text);margin-bottom:4px;">
        📍 ${esc(t)}
      </div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.4;">
        ${esc(a)}
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);background:var(--surface2);padding:4px 8px;border-radius:4px;margin-bottom:10px;border:1px solid var(--border);">
        ${coordsText}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="btn-sm" style="font-size:11px;padding:4px 8px;" onclick="copyMapCoordinates(${lat}, ${lng})">
          📋 Copy
        </button>
        <button class="btn-sm" style="font-size:11px;padding:4px 8px;background:rgba(245,158,11,0.15);color:var(--orange);border-color:rgba(245,158,11,0.3);" onclick="bookmarkCurrentPin('${esc(t)}', '${esc(a)}', ${lat}, ${lng})">
          ⭐ Save
        </button>
        <button class="btn-sm" style="font-size:11px;padding:4px 8px;background:rgba(124,106,247,0.15);color:var(--accent);border-color:rgba(124,106,247,0.3);" onclick="saveLocationToVaultNotes('${esc(t)}', '${esc(a)}', ${lat}, ${lng})">
          📝 Notes
        </button>
      </div>
    </div>
  `;

  marker.bindPopup(getPopupContent(title, address)).openPopup();

  if (shouldReverseGeocode) {
    try {
      const res = await api('GET', `/public/reverse-geocode?lat=${lat}&lon=${lng}`);
      if (res && res.success) {
        title = res.name || res.displayName?.split(',')[0] || title;
        address = res.displayName || address;
        marker.setPopupContent(getPopupContent(title, address));
      }
    } catch (_) {}
  }

  updateMapHud();
}

async function executeMapSearch() {
  const input = document.getElementById('mapSearchInput');
  const query = (input ? input.value : vaultMapSearchQuery).trim();
  if (!query) {
    toast('Please enter a location or coordinates to search');
    return;
  }

  // Check if query is raw coordinates e.g. "40.7128, -74.006"
  const coordMatch = query.match(/^([-+]?\d+(\.\d+)?)[,\s]+([-+]?\d+(\.\d+)?)$/);
  if (coordMatch) {
    const lat = parseFloat(coordMatch[1]);
    const lng = parseFloat(coordMatch[3]);
    if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
      if (vaultMapInstance) {
        vaultMapInstance.flyTo([lat, lng], 14, { duration: 1.5 });
        dropMapMarker(lat, lng, true, `Coords: ${lat.toFixed(4)}, ${lng.toFixed(4)}`);
        toast(`Flew to coordinates: ${lat.toFixed(4)}, ${lng.toFixed(4)} 📍`);
      }
      return;
    }
  }

  vaultMapSearchQuery = query;
  isVaultMapSearching = true;

  const btn = document.getElementById('btnSearchMap');
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Searching…';
  }

  try {
    const res = await api('GET', `/public/geocode?q=${encodeURIComponent(query)}`);
    if (res && res.success && res.results && res.results.length) {
      vaultMapSearchResults = res.results;
      const top = res.results[0];
      if (vaultMapInstance) {
        vaultMapInstance.flyTo([top.lat, top.lon], 13, { duration: 1.5 });
        dropMapMarker(top.lat, top.lon, false, top.name || top.displayName);
      }
      renderMapSearchResultsDropdown(res.results);
      toast(`Found: ${top.name || query} 🗺️`);
    } else {
      toast('No location found for "' + query + '"');
      const drop = document.getElementById('mapSearchResultsContainer');
      if (drop) drop.style.display = 'none';
    }
  } catch (err) {
    toast('Geocoding error: ' + err.message);
  } finally {
    isVaultMapSearching = false;
    if (btn) {
      btn.disabled = false;
      btn.textContent = '🔍 Search Map';
    }
  }
}

function renderMapSearchResultsDropdown(results) {
  const container = document.getElementById('mapSearchResultsContainer');
  if (!container) return;

  if (!results || !results.length) {
    container.style.display = 'none';
    return;
  }

  container.style.display = 'block';
  container.innerHTML = `
    <div style="font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600;">SEARCH RESULTS:</div>
    <div style="display:flex;flex-direction:column;gap:4px;">
      ${results.map((r, idx) => `
        <div 
          onclick="selectGeocodedResult(${idx})"
          style="padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:4px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;"
          onmouseenter="this.style.borderColor='var(--accent)'"
          onmouseleave="this.style.borderColor='var(--border)'"
        >
          <div style="font-size:13px;font-weight:600;color:var(--text);">${esc(r.name || r.displayName.split(',')[0])}</div>
          <div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%;">${esc(r.displayName)}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function selectGeocodedResult(idx) {
  const r = vaultMapSearchResults[idx];
  if (!r || !vaultMapInstance) return;

  vaultMapInstance.flyTo([r.lat, r.lon], 14, { duration: 1.5 });
  dropMapMarker(r.lat, r.lon, false, r.name || r.displayName);

  const container = document.getElementById('mapSearchResultsContainer');
  if (container) container.style.display = 'none';
}

function locateUserOnMap() {
  if (!navigator.geolocation) {
    toast('Geolocation not supported in this browser');
    return;
  }
  toast('Requesting device GPS position... 🎯');
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude, longitude, accuracy } = pos.coords;
      if (vaultMapInstance && typeof L !== 'undefined') {
        vaultMapInstance.flyTo([latitude, longitude], 15, { duration: 1.5 });
        L.circle([latitude, longitude], {
          radius: accuracy || 50,
          color: '#7c6af7',
          fillColor: '#7c6af7',
          fillOpacity: 0.15,
          weight: 2
        }).addTo(vaultMapInstance);
        dropMapMarker(latitude, longitude, true, 'Your Current Location 🎯');
        toast(`Located! Accuracy ±${Math.round(accuracy)}m`);
      }
    },
    (err) => {
      toast('Location access error: ' + err.message);
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

async function loadMapPinsFromDatabase() {
  try {
    const res = await fetch('/api/map/pins');
    const data = await res.json();
    if (data.success && Array.isArray(data.pins) && data.pins.length > 0) {
      const dbPins = data.pins.map(p => ({
        id: p.id,
        title: p.title,
        address: p.notes || '',
        lat: Number(p.lat),
        lng: Number(p.lng),
        savedAt: p.created_at
      }));
      // Merge with any offline pins
      const map = new Map();
      dbPins.forEach(p => map.set(p.id, p));
      vaultMapSavedPins.forEach(p => { if (!map.has(p.id)) map.set(p.id, p); });
      vaultMapSavedPins = Array.from(map.values());
      localStorage.setItem('vault_saved_map_pins', JSON.stringify(vaultMapSavedPins));

      const listEl = document.getElementById('mapSavedPlacesList');
      if (listEl) listEl.innerHTML = renderSavedPlacesCardsHtml();
      const countBadge = document.getElementById('mapPinCountBadge');
      if (countBadge) countBadge.textContent = `${vaultMapSavedPins.length} Bookmarks`;
      renderSavedPinsOnMap();
    }
  } catch (_) {}
}

  return chatMessages.map((msg, idx) => {

function formatBotMessage(rawText) {
  let text = rawText || '';

  const taskActions = [];
  const pwActions = [];

  text = text.replace(/```action:task\s*([\s\S]*?)```/g, (match, jsonStr) => {
    try {
      const data = JSON.parse(jsonStr.trim());
      taskActions.push(data);
      return `[[TASK_ACTION_${taskActions.length - 1}]]`;
    } catch(e) {
      return match;
    }
  });

  text = text.replace(/```action:password\s*([\s\S]*?)```/g, (match, jsonStr) => {
    try {
      const data = JSON.parse(jsonStr.trim());
      pwActions.push(data);
      return `[[PW_ACTION_${pwActions.length - 1}]]`;
    } catch(e) {
      return match;
    }
  });

  text = esc(text);

  text = text.replace(/^### (.*$)/gim, '<div style="font-weight:700;font-size:15px;color:var(--text);margin:8px 0 4px;">$1</div>');
  text = text.replace(/^## (.*$)/gim, '<div style="font-weight:700;font-size:16px;color:var(--text);margin:10px 0 6px;">$1</div>');
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/```([a-z]*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  text = text.replace(/^\s*[-•]\s+(.*$)/gim, '<div style="display:flex;gap:6px;margin:3px 0;"><span>•</span><span>$1</span></div>');
  text = text.replace(/\n\n/g, '<div style="height:8px"></div>').replace(/\n/g, '<br>');

  taskActions.forEach((task, idx) => {
    const cardHtml = `
      <div class="chat-action-card">
        <div style="font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;">
          <span>📋</span><span>${esc(task.title || 'New Task')}</span>
        </div>
        ${task.description ? `<div style="font-size:12px;color:var(--muted);">${esc(task.description)}</div>` : ''}
        <div style="font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;">
          <span>Priority: <strong style="color:var(--text);text-transform:capitalize;">${esc(task.priority||'medium')}</strong></span>
          ${task.due_date ? `<span>Due: <strong style="color:var(--accent);">${esc(task.due_date)}</strong></span>` : ''}
          ${task.category ? `<span>Category: <strong style="color:var(--text);">${esc(task.category)}</strong></span>` : ''}
        </div>
        <button class="chat-action-btn" onclick="applyChatTask('${encodeURIComponent(JSON.stringify(task))}')">
          ➕ Add to Tasks
        </button>
      </div>
    `;
    text = text.replace(`[[TASK_ACTION_${idx}]]`, cardHtml);
  });

  pwActions.forEach((pw, idx) => {
    const cardHtml = `
      <div class="chat-action-card">
        <div style="font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;">
          <span>🔑</span><span>${esc(pw.title || 'New Password')}</span>
        </div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);word-break:break-all;background:var(--surface);padding:6px 10px;border-radius:4px;border:1px solid var(--border);">
          ${esc(pw.password || '')}
        </div>
        ${pw.username ? `<div style="font-size:11px;color:var(--muted);">Username: ${esc(pw.username)}</div>` : ''}
        <div style="display:flex;gap:6px;margin-top:2px;">
          <button class="copy-btn" onclick="copyText('${esc(pw.password || '')}')">📋 Copy</button>
          <button class="chat-action-btn" style="flex:1" onclick="applyChatPassword('${encodeURIComponent(JSON.stringify(pw))}')">
            ➕ Save to Passwords
          </button>
        </div>
      </div>
    `;
    text = text.replace(`[[PW_ACTION_${idx}]]`, cardHtml);
  });

  return text;
}

function scrollChatToBottom() {
  const el = document.getElementById('chatMessages');
  if (el) el.scrollTop = el.scrollHeight;
}

async function sendSuggestion(text) {
  const input = document.getElementById('chatInput');
  if (input) input.value = text;
  await sendChatMessage();
}

async function sendChatMessage() {
  if (isChatSending) return;
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('chatSendBtn');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;

  chatMessages.push({ role: 'user', text });
  input.value = '';
  isChatSending = true;
  if (sendBtn) {
    sendBtn.disabled = true;
    sendBtn.style.opacity = '0.6';
  }

  chatMessages.push({ role: 'bot', text: 'Thinking…', provider: currentAiProvider, model: currentAiModel });
  const messagesEl = document.getElementById('chatMessages');
  if (messagesEl) messagesEl.innerHTML = renderChatMessagesHtml();
  scrollChatToBottom();

  try {
    const res = await fetch(API + '/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + masterKey
      },
      body: JSON.stringify({ 
        message: text, 
        history: chatMessages.slice(0, -2),
        provider: currentAiProvider,
        model: currentAiModel
      })
    });
    const data = await res.json();
    const lastMsg = chatMessages[chatMessages.length - 1];
    lastMsg.text = data.reply || 'No response received from Assistant.';
    lastMsg.provider = data.provider || currentAiProvider;
    lastMsg.model = data.model || currentAiModel;

    if (voiceTalkingMode) {
      speakVoiceAssistantResponse(lastMsg.text);
    }
  } catch (err) {
    chatMessages[chatMessages.length - 1].text = '⚠️ Sorry, an error occurred while connecting to the assistant: ' + err.message;
  } finally {
    isChatSending = false;
    if (sendBtn) {
      sendBtn.disabled = false;
      sendBtn.style.opacity = '1';
    }
    if (messagesEl) messagesEl.innerHTML = renderChatMessagesHtml();
    scrollChatToBottom();
  }
}

async function applyChatTask(encoded) {
  try {
    const task = JSON.parse(decodeURIComponent(encoded));
    await api('POST', '/todos', {
      title: task.title,
      description: task.description || '',
      due_date: task.due_date || null,
      priority: task.priority || 'medium',
      category: task.category || 'General',
      subtasks: task.subtasks || [],
      completed: 0
    });
    toast('Task added to Vault!');
  } catch(e) {
    toast('Failed to add task: ' + e.message);
  }
}

async function applyChatPassword(encoded) {
  try {
    const pw = JSON.parse(decodeURIComponent(encoded));
    await api('POST', '/passwords', {
      title: pw.title,
      username: pw.username || '',
      password: pw.password,
      url: pw.url || '',
      description: pw.description || ''
    });
    toast('Password saved to Vault!');
  } catch(e) {
    toast('Failed to save password: ' + e.message);
  }
}

function openChangePasswordModal() {
  openModal(`

    </div>

      <input type="password" id="changeConfirmPw" placeholder="Re-enter new password" />
    </div>
    <div class="modal-actions">

    </div>
  `);

async function submitChangePassword() {
  const current = document.getElementById('changeCurrentPw').value.trim();
  const next = document.getElementById('changeNewPw').value.trim();
  const confirm = document.getElementById('changeConfirmPw').value.trim();

  if (!current) return toast('Please enter your current password');
  if (!next || next.length < 4) return toast('New password must be at least 4 characters');
  if (next !== confirm) return toast('New passwords do not match');

  try {
    const res = await fetch(`${API}/auth/change-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ currentPassword: current, newPassword: next })
    });
    const data = await res.json();
    if (res.ok && data.success) {
      masterKey = next;
      sessionStorage.setItem('vault_master_key', next);
      closeModal();
      toast('Master password updated successfully!');
    } else {
      toast('❌ ' + (data.error || 'Failed to update master password'));
    }
  } catch (err) {
    toast('Error updating password: ' + err.message);
  }
}

// Backup & Export Functions
async function exportD1Sql() {
  try {
    const data = await api('GET', '/backup/export');
    const blob = new Blob([data.sql], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vault_d1.sql';
    a.click();
    URL.revokeObjectURL(url);
    toast('D1 SQL script downloaded!');
  } catch (err) {
    toast('Export failed: ' + err.message);
  }
}

async function exportJsonBackup() {
  try {
    const data = await api('GET', '/backup/export');
    const blob = new Blob([JSON.stringify({ passwords: data.passwords, todos: data.todos, exported_at: data.timestamp }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vault_backup_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('JSON backup downloaded!');
  } catch (err) {
    toast('Export failed: ' + err.message);
  }
}

function triggerImport() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const json = JSON.parse(reader.result);
        const res = await api('POST', '/backup/import', json);
        toast(`Imported ${res.importedPasswords || 0} passwords & ${res.importedTodos || 0} tasks!`);
        await renderCloudflareHub();
      } catch (err) {
        toast('Import failed: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function toggleTurnstile(enabled) {
  localStorage.setItem('vault_turnstile_enabled', enabled ? 'true' : 'false');
  fetch('/api/settings/set', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key: 'vault_turnstile_enabled', value: enabled })
  }).catch(() => {});
  const widget = document.getElementById('turnstileWidget');
  if (widget) {
    widget.style.display = enabled ? 'flex' : 'none';
  }
  toast(enabled ? 'Turnstile protection enabled (Saved to DB)' : 'Turnstile protection disabled (Saved to DB)');
}

async function runHubWorkersAiTest() {
  const model = document.getElementById('hubAiModel').value;
  const prompt = document.getElementById('hubAiPrompt').value.trim();
  const resultEl = document.getElementById('hubAiResult');
  const runBtn = document.getElementById('hubAiRunBtn');

  if (!prompt) return toast('Please enter a prompt');
  runBtn.disabled = true;
  runBtn.textContent = 'Running on Edge…';
  resultEl.style.display = 'block';
  resultEl.textContent = 'Querying Cloudflare Workers AI edge node…';

  try {
    const res = await fetch(API + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        provider: 'cloudflare',
        model: model,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    resultEl.textContent = data.response || data.text || JSON.stringify(data, null, 2);
    toast('Workers AI responded successfully!');
  } catch(e) {
    resultEl.textContent = 'Workers AI Edge Request: ' + e.message + '\n\nNote: If deploying to Cloudflare Pages, env.AI binding is automatically active with 10,000 free neurons/day.';
  } finally {
    runBtn.disabled = false;
    runBtn.textContent = '⚡ Run Edge Inference';
  }
}
