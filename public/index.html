<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0f0f13"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Vault — Passwords & Tasks</title>
<meta name="description" content="Secure vault for managing passwords, tasks, and attachments with a master password."/>
<meta property="og:title" content="Vault — Passwords & Tasks"/>
<meta property="og:description" content="Secure vault for managing passwords, tasks, and attachments with a master password."/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --surface: #18181f;
    --surface2: #21212c;
    --border: #2a2a38;
    --text: #e8e8f0;
    --muted: #6b6b82;
    --accent: #7c6af7;
    --accent-glow: rgba(124,106,247,0.18);
    --red: #f04f5a;
    --red-bg: rgba(240,79,90,0.12);
    --orange: #f59e0b;
    --orange-bg: rgba(245,158,11,0.12);
    --green: #22c55e;
    --green-bg: rgba(34,197,94,0.1);
    --radius: 12px;
    --radius-sm: 8px;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; }

  /* LOCK SCREEN */
  #lockScreen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1000; gap: 24px; padding: 32px;
  }
  .lock-icon { font-size: 56px; }
  .lock-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .lock-sub { color: var(--muted); font-size: 14px; text-align: center; max-width: 260px; line-height: 1.5; }
  .lock-input {
    width: 100%; max-width: 320px; padding: 14px 18px;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-size: 16px;
    font-family: 'JetBrains Mono', monospace; letter-spacing: 2px;
    outline: none; text-align: center;
    transition: border-color 0.2s;
  }
  .lock-input:focus { border-color: var(--accent); }
  .lock-btn {
    width: 100%; max-width: 320px; padding: 14px;
    background: var(--accent); border: none; border-radius: var(--radius);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: opacity 0.2s;
  }
  .lock-btn:hover { opacity: 0.88; }
  .lock-note { font-size: 12px; color: var(--muted); text-align: center; max-width: 280px; line-height: 1.5; }

  /* APP */
  #app { display: none; flex-direction: column; height: 100dvh; overflow: hidden; }
  #app.visible { display: flex; }

  /* TOP BAR */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 12px; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .topbar-actions { display: flex; gap: 8px; }

  /* TABS */
  .tabs {
    display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0;
    padding: 0 20px; gap: 0;
  }
  .tab {
    padding: 12px 20px; font-size: 14px; font-weight: 500; color: var(--muted);
    border: none; background: none; cursor: pointer; position: relative;
    transition: color 0.2s;
  }
  .tab.active { color: var(--text); }
  .tab.active::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 2px; background: var(--accent); border-radius: 2px 2px 0 0;
  }

  /* MAIN CONTENT */
  .main { flex: 1; overflow-y: auto; padding: 16px 20px 100px; }

  /* SEARCH */
  .search-wrap { margin-bottom: 16px; position: relative; }
  .search-input {
    width: 100%; padding: 11px 16px 11px 40px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); font-size: 14px;
    outline: none; transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; pointer-events: none; }

  /* CARDS */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 10px; overflow: hidden;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: var(--accent); }
  .card.urgent { border-color: var(--red); background: linear-gradient(135deg, var(--surface), #1a1218); }
  .card.soon { border-color: var(--orange); }
  .card.done { opacity: 0.5; }

  .card-header {
    display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
    cursor: pointer;
  }
  .card-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
  .card-info { flex: 1; min-width: 0; }
  .card-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-sub { font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .badge {
    padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 600;
  }
  .badge-red { background: var(--red-bg); color: var(--red); }
  .badge-orange { background: var(--orange-bg); color: var(--orange); }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-accent { background: var(--accent-glow); color: var(--accent); }

  .card-expanded { padding: 0 16px 14px; border-top: 1px solid var(--border); }
  .card-desc { font-size: 13px; color: var(--muted); margin-top: 12px; line-height: 1.6; }
  .card-field { margin-top: 10px; }
  .card-field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .card-field .val { font-family: 'JetBrains Mono', monospace; font-size: 13px; margin-top: 4px; word-break: break-all; display: flex; align-items: center; gap: 8px; }
  .copy-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer; color: var(--muted); transition: color 0.2s; }
  .copy-btn:hover { color: var(--text); }
  .pw-hidden { filter: blur(5px); cursor: pointer; transition: filter 0.2s; }
  .pw-hidden:hover { filter: blur(0); }

  /* ATTACHMENTS */
  .attach-section { margin-top: 12px; }
  .attach-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .attach-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .attach-chip {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; font-size: 12px;
    cursor: pointer; transition: border-color 0.2s;
  }
  .attach-chip:hover { border-color: var(--accent); }
  .attach-del { color: var(--muted); margin-left: 4px; font-size: 14px; }
  .attach-del:hover { color: var(--red); }
  .attach-upload {
    display: flex; align-items: center; gap: 6px;
    background: none; border: 1px dashed var(--border);
    border-radius: 6px; padding: 5px 10px; font-size: 12px; color: var(--muted);
    cursor: pointer; transition: border-color 0.2s, color 0.2s;
  }
  .attach-upload:hover { border-color: var(--accent); color: var(--accent); }

  /* ICON BUTTONS */
  .icon-btn {
    width: 32px; height: 32px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--surface2);
    color: var(--muted); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, color 0.2s;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn.danger:hover { border-color: var(--red); color: var(--red); }

  /* FAB */
  .fab {
    position: fixed; bottom: 24px; right: 20px;
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--accent); border: none;
    font-size: 24px; color: #fff; cursor: pointer;
    box-shadow: 0 4px 24px rgba(124,106,247,0.4);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
    z-index: 100;
  }
  .fab:hover { transform: scale(1.08); box-shadow: 0 6px 32px rgba(124,106,247,0.5); }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 500; opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); border-radius: 20px 20px 0 0;
    width: 100%; max-width: 600px; padding: 24px 24px 40px;
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    max-height: 90dvh; overflow-y: auto;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
  .modal-close { float: right; background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }

  /* FORM */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 11px 14px;
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); font-size: 14px;
    font-family: inherit; outline: none; transition: border-color 0.2s;
    resize: vertical;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field select option { background: var(--surface2); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .submit-btn {
    width: 100%; padding: 14px; background: var(--accent);
    border: none; border-radius: var(--radius); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px;
    transition: opacity 0.2s;
  }
  .submit-btn:hover { opacity: 0.88; }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; line-height: 1.5; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface2); border: 1px solid var(--border);
    padding: 10px 20px; border-radius: 30px; font-size: 13px;
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; z-index: 9999; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* CHECKBOX */
  .check-btn {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
    background: none; cursor: pointer; flex-shrink: 0; margin-top: 1px;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    transition: border-color 0.2s, background 0.2s;
  }
  .check-btn.checked { background: var(--green); border-color: var(--green); }

  /* DUE DATE indicator */
  .due-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; margin-top: 4px; }

  .section-header { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; margin: 16px 0 8px; font-weight: 600; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lockScreen">
  <div class="lock-icon">🔐</div>
  <div class="lock-title">Vault</div>
  <div class="lock-sub">Your passwords & tasks, secured behind a master password.</div>
  <input class="lock-input" type="password" id="masterPw" placeholder="Master password" autocomplete="current-password"/>
  <button class="lock-btn" onclick="unlock()">Unlock</button>
  <div class="lock-note">First time? Set any password — it will be saved as your master key. Data is stored in your Cloudflare D1 database.</div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-title">🔐 Vault</div>
    <div class="topbar-actions">
      <button class="icon-btn" onclick="lockApp()" title="Lock">🔒</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('todos')" id="tab-todos">✅ Tasks</button>
    <button class="tab" onclick="switchTab('passwords')" id="tab-passwords">🔑 Passwords</button>
  </div>

  <div class="main" id="mainContent">
    <!-- dynamic content -->
  </div>
</div>

<button class="fab" id="fabBtn" onclick="openAdd()">＋</button>
<div class="toast" id="toast"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div id="modalContent"></div>
  </div>
</div>

<input type="file" id="fileInput" style="display:none" multiple onchange="handleFileUpload(event)"/>

<script>
const API = '/api';
let masterKey = '';
let currentTab = 'todos';
let expandedCards = new Set();
let attachments = {}; // cache: "type-id" -> []
let pendingAttachItem = null;

// ---- LOCK / UNLOCK ----
function unlock() {
  const pw = document.getElementById('masterPw').value.trim();
  if (!pw) return toast('Enter a master password');
  masterKey = pw;
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  loadTab();
}
document.getElementById('masterPw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

function lockApp() {
  masterKey = '';
  expandedCards.clear();
  document.getElementById('app').classList.remove('visible');
  document.getElementById('lockScreen').style.display = 'flex';
  document.getElementById('masterPw').value = '';
}

// ---- TABS ----
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  loadTab();
}

async function loadTab() {
  const content = document.getElementById('mainContent');
  content.innerHTML = '<div style="color:var(--muted);padding:40px 0;text-align:center">Loading…</div>';
  if (currentTab === 'todos') await renderTodos();
  else await renderPasswords();
}

// ---- API ----
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + masterKey } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  return r.json();
}

// ---- TODOS ----
async function renderTodos(filter = '') {
  const content = document.getElementById('mainContent');
  const todos = await api('GET', '/todos');
  const now = new Date();

  const filtered = todos.filter(t =>
    !filter || t.title.toLowerCase().includes(filter) || (t.description||'').toLowerCase().includes(filter)
  );

  const pending = filtered.filter(t => !t.completed);
  const done = filtered.filter(t => t.completed);

  let html = `<div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" placeholder="Search tasks…" oninput="renderTodos(this.value.toLowerCase())" value="${filter}"/>
  </div>`;

  if (pending.length === 0 && done.length === 0) {
    html += `<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">No tasks yet.<br>Tap + to add your first task.</div></div>`;
  }

  if (pending.length) {
    html += '<div class="section-header">Pending</div>';
    html += pending.map(t => todoCard(t, now)).join('');
  }
  if (done.length) {
    html += '<div class="section-header">Completed</div>';
    html += done.map(t => todoCard(t, now)).join('');
  }

  content.innerHTML = html;
}

function getDueDiff(due) {
  if (!due) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(due); d.setHours(0,0,0,0);
  return Math.round((d - now) / 86400000);
}

function dueBadge(due, completed) {
  if (!due || completed) return '';
  const diff = getDueDiff(due);
  if (diff < 0) return `<span class="badge badge-red">⚠ Overdue ${Math.abs(diff)}d</span>`;
  if (diff === 0) return `<span class="badge badge-red">🔴 Due today</span>`;
  if (diff <= 2) return `<span class="badge badge-orange">🟠 ${diff}d left</span>`;
  return `<span class="badge badge-accent">📅 ${diff}d</span>`;
}

function todoCard(t, now) {
  const urgent = !t.completed && t.due_date && getDueDiff(t.due_date) <= 0;
  const soon = !t.completed && t.due_date && getDueDiff(t.due_date) <= 2 && getDueDiff(t.due_date) > 0;
  const cls = t.completed ? 'done' : urgent ? 'urgent' : soon ? 'soon' : '';
  const expanded = expandedCards.has('todo-' + t.id);
  const priColor = t.priority === 'high' ? 'var(--red)' : t.priority === 'medium' ? 'var(--orange)' : 'var(--muted)';

  return `<div class="card ${cls}" id="card-todo-${t.id}">
    <div class="card-header">
      <button class="check-btn ${t.completed ? 'checked' : ''}" onclick="toggleTodo(${t.id}, ${!t.completed})">${t.completed ? '✓' : ''}</button>
      <div class="card-info" onclick="toggleExpand('todo', ${t.id})">
        <div class="card-title" style="${t.completed ? 'text-decoration:line-through' : ''}">${esc(t.title)}</div>
        <div class="card-sub">${dueBadge(t.due_date, t.completed)} <span style="color:${priColor};font-size:11px">${t.priority}</span></div>
      </div>
      <div class="card-actions">
        <button class="icon-btn" onclick="editTodo(${t.id})">✏️</button>
        <button class="icon-btn danger" onclick="deleteTodo(${t.id})">🗑️</button>
      </div>
    </div>
    ${expanded ? `<div class="card-expanded">
      ${t.description ? `<div class="card-desc">${esc(t.description)}</div>` : ''}
      <div class="attach-section">
        <div class="attach-title">Attachments</div>
        <div class="attach-list" id="attach-todo-${t.id}">Loading…</div>
        <button class="attach-upload" onclick="startAttach('todo', ${t.id})">📎 Attach file</button>
      </div>
    </div>` : ''}
  </div>`;
}

async function toggleTodo(id, completed) {
  const todos = await api('GET', '/todos');
  const t = todos.find(x => x.id === id);
  if (!t) return;
  await api('PUT', '/todos/' + id, { ...t, completed });
  renderTodos();
}

async function deleteTodo(id) {
  if (!confirm('Delete this task?')) return;
  await api('DELETE', '/todos/' + id);
  expandedCards.delete('todo-' + id);
  renderTodos();
  toast('Task deleted');
}

// ---- PASSWORDS ----
async function renderPasswords(filter = '') {
  const content = document.getElementById('mainContent');
  const passwords = await api('GET', '/passwords');

  const filtered = passwords.filter(p =>
    !filter || p.title.toLowerCase().includes(filter) || (p.username||'').toLowerCase().includes(filter) || (p.url||'').toLowerCase().includes(filter)
  );

  let html = `<div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" placeholder="Search passwords…" oninput="renderPasswords(this.value.toLowerCase())" value="${filter}"/>
  </div>`;

  if (filtered.length === 0) {
    html += `<div class="empty"><div class="empty-icon">🔑</div><div class="empty-text">No passwords saved yet.<br>Tap + to add one.</div></div>`;
  } else {
    html += filtered.map(p => passwordCard(p)).join('');
  }

  content.innerHTML = html;
}

function passwordCard(p) {
  const expanded = expandedCards.has('password-' + p.id);
  return `<div class="card" id="card-password-${p.id}">
    <div class="card-header" onclick="toggleExpand('password', ${p.id})">
      <div class="card-icon">🔑</div>
      <div class="card-info">
        <div class="card-title">${esc(p.title)}</div>
        <div class="card-sub">${p.username ? esc(p.username) : p.url ? esc(p.url) : 'No username'}</div>
      </div>
      <div class="card-actions">
        <button class="icon-btn" onclick="event.stopPropagation();editPassword(${p.id})">✏️</button>
        <button class="icon-btn danger" onclick="event.stopPropagation();deletePassword(${p.id})">🗑️</button>
      </div>
    </div>
    ${expanded ? `<div class="card-expanded">
      ${p.username ? `<div class="card-field"><label>Username</label><div class="val">${esc(p.username)}<button class="copy-btn" onclick="copyText('${esc(p.username)}')">Copy</button></div></div>` : ''}
      <div class="card-field"><label>Password</label>
        <div class="val"><span class="pw-hidden" title="Hover to reveal">${esc(p.password)}</span><button class="copy-btn" onclick="copyText('${p.password.replace(/'/g,"\\'")}')">Copy</button></div>
      </div>
      ${p.url ? `<div class="card-field"><label>URL</label><div class="val"><a href="${esc(p.url)}" target="_blank" style="color:var(--accent)">${esc(p.url)}</a></div></div>` : ''}
      ${p.description ? `<div class="card-desc">${esc(p.description)}</div>` : ''}
      <div class="attach-section">
        <div class="attach-title">Attachments</div>
        <div class="attach-list" id="attach-password-${p.id}">Loading…</div>
        <button class="attach-upload" onclick="startAttach('password', ${p.id})">📎 Attach file</button>
      </div>
    </div>` : ''}
  </div>`;
}

async function deletePassword(id) {
  if (!confirm('Delete this password?')) return;
  await api('DELETE', '/passwords/' + id);
  expandedCards.delete('password-' + id);
  renderPasswords();
  toast('Password deleted');
}

// ---- EXPAND / COLLAPSE ----
async function toggleExpand(type, id) {
  const key = type + '-' + id;
  if (expandedCards.has(key)) {
    expandedCards.delete(key);
  } else {
    expandedCards.add(key);
  }
  if (currentTab === 'todos') renderTodos();
  else renderPasswords();

  if (expandedCards.has(key)) {
    setTimeout(() => loadAttachments(type, id), 100);
  }
}

// ---- ATTACHMENTS ----
async function loadAttachments(type, id) {
  const container = document.getElementById(`attach-${type}-${id}`);
  if (!container) return;
  const list = await api('GET', `/attachments/${type}/${id}`);
  if (!list.length) { container.innerHTML = '<span style="color:var(--muted);font-size:12px">No files attached</span>'; return; }
  container.innerHTML = list.map(a => `
    <div class="attach-chip" onclick="downloadAttach(${a.id}, '${esc(a.filename)}')">
      📎 ${esc(a.filename)}
      <span class="attach-del" onclick="event.stopPropagation();deleteAttach(${a.id},'${type}',${id})">✕</span>
    </div>
  `).join('');
}

function startAttach(type, id) {
  pendingAttachItem = { type, id };
  document.getElementById('fileInput').click();
}

async function handleFileUpload(event) {
  const files = Array.from(event.target.files);
  if (!files.length || !pendingAttachItem) return;
  for (const file of files) {
    const content = await toBase64(file);
    await api('POST', '/attachments', {
      item_type: pendingAttachItem.type,
      item_id: pendingAttachItem.id,
      filename: file.name,
      content,
      mime_type: file.type
    });
  }
  loadAttachments(pendingAttachItem.type, pendingAttachItem.id);
  event.target.value = '';
  toast(`${files.length} file(s) attached`);
}

function toBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function downloadAttach(id, filename) {
  const data = await api('GET', `/attachments/download/${id}`);
  const a = document.createElement('a');
  a.href = data.content;
  a.download = filename;
  a.click();
}

async function deleteAttach(id, type, itemId) {
  if (!confirm('Remove attachment?')) return;
  await api('DELETE', `/attachments/delete/${id}`);
  loadAttachments(type, itemId);
  toast('Attachment removed');
}

// ---- ADD / EDIT MODAL ----
let editingId = null;

function openAdd() {
  editingId = null;
  if (currentTab === 'todos') showTodoForm(null);
  else showPasswordForm(null);
}

function showTodoForm(t) {
  document.getElementById('modalContent').innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">${t ? '✏️ Edit Task' : '➕ New Task'}</div>
    <div class="field"><label>Title *</label><input id="f-title" value="${t ? esc(t.title) : ''}" placeholder="Task title"/></div>
    <div class="field"><label>Description</label><textarea id="f-desc" rows="3" placeholder="Notes or details…">${t ? esc(t.description||'') : ''}</textarea></div>
    <div class="form-row">
      <div class="field"><label>Due Date</label><input type="date" id="f-due" value="${t ? (t.due_date||'') : ''}"/></div>
      <div class="field"><label>Priority</label>
        <select id="f-priority">
          <option value="low" ${t?.priority==='low'?'selected':''}>Low</option>
          <option value="medium" ${!t||t?.priority==='medium'?'selected':''}>Medium</option>
          <option value="high" ${t?.priority==='high'?'selected':''}>High</option>
        </select>
      </div>
    </div>
    <button class="submit-btn" onclick="saveTodo()">${t ? 'Save Changes' : 'Add Task'}</button>
  `;
  openModal();
}

function showPasswordForm(p) {
  document.getElementById('modalContent').innerHTML = `
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">${p ? '✏️ Edit Password' : '➕ New Password'}</div>
    <div class="field"><label>Title *</label><input id="f-title" value="${p ? esc(p.title) : ''}" placeholder="e.g. Gmail, Netflix…"/></div>
    <div class="field"><label>Username / Email</label><input id="f-username" value="${p ? esc(p.username||'') : ''}" placeholder="user@example.com"/></div>
    <div class="field"><label>Password *</label><input id="f-password" type="text" value="${p ? esc(p.password) : ''}" placeholder="••••••••"/></div>
    <div class="field"><label>Website URL</label><input id="f-url" value="${p ? esc(p.url||'') : ''}" placeholder="https://…"/></div>
    <div class="field"><label>Notes</label><textarea id="f-desc" rows="2" placeholder="Security questions, recovery codes…">${p ? esc(p.description||'') : ''}</textarea></div>
    <button class="submit-btn" onclick="savePassword()">${p ? 'Save Changes' : 'Save Password'}</button>
  `;
  openModal();
}

async function editTodo(id) {
  editingId = id;
  const todos = await api('GET', '/todos');
  showTodoForm(todos.find(t => t.id === id));
}

async function editPassword(id) {
  editingId = id;
  const passwords = await api('GET', '/passwords');
  showPasswordForm(passwords.find(p => p.id === id));
}

async function saveTodo() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) return toast('Title is required');
  const body = {
    title,
    description: document.getElementById('f-desc').value.trim(),
    due_date: document.getElementById('f-due').value || null,
    priority: document.getElementById('f-priority').value,
    completed: 0
  };
  if (editingId) {
    const todos = await api('GET', '/todos');
    const t = todos.find(x => x.id === editingId);
    await api('PUT', '/todos/' + editingId, { ...body, completed: t?.completed || 0 });
    toast('Task updated');
  } else {
    await api('POST', '/todos', body);
    toast('Task added');
  }
  closeModal();
  renderTodos();
}

async function savePassword() {
  const title = document.getElementById('f-title').value.trim();
  const password = document.getElementById('f-password').value.trim();
  if (!title || !password) return toast('Title and password are required');
  const body = {
    title,
    username: document.getElementById('f-username').value.trim(),
    password,
    url: document.getElementById('f-url').value.trim(),
    description: document.getElementById('f-desc').value.trim()
  };
  if (editingId) {
    await api('PUT', '/passwords/' + editingId, body);
    toast('Password updated');
  } else {
    await api('POST', '/passwords', body);
    toast('Password saved');
  }
  closeModal();
  renderPasswords();
}

// ---- MODAL UTILS ----
function openModal() { document.getElementById('modalOverlay').classList.add('open'); }
function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('open');
}

// ---- HELPERS ----
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('Copied!')).catch(() => toast('Copy failed'));
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}
</script>
