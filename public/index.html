async function renderPasswords() {
  const content = document.getElementById('mainContent');
  let rawPasswords = [];
  try {
    rawPasswords = await api('GET', '/passwords');
  } catch (e) {
    console.warn('Passwords load warning:', e);
  }
  const passwords = Array.isArray(rawPasswords) ? rawPasswords : [];

  // Compute reused and weak maps
  const pwCounts = {};
  passwords.forEach(p => {
    if (p.password) pwCounts[p.password] = (pwCounts[p.password] || 0) + 1;
  });

  const filtered = passwords.filter(p => {
    const q = pwSearchFilter;
    const matchesSearch = !q || 
      p.title.toLowerCase().includes(q) || 
      (p.username||'').toLowerCase().includes(q) || 
      (p.url||'').toLowerCase().includes(q);

    if (!matchesSearch) return false;

    if (pwTypeFilter === 'Logins') return !p.item_type || p.item_type === 'login';
    if (pwTypeFilter === '2FA Active') return Boolean(p.totp_secret && p.totp_secret.trim());
    if (pwTypeFilter === 'Weak') {
      const pw = p.password || '';
      return pw.length < 12 || !/[0-9]/.test(pw) || !/[^A-Za-z0-9]/.test(pw);
    }
    if (pwTypeFilter === 'Reused') {
      return p.password && pwCounts[p.password] > 1;
    }
    return true;
  });

  const isInputFocused = (document.activeElement?.id === 'pw-search-input');
  const selStart = isInputFocused ? document.activeElement.selectionStart : null;
  const selEnd = isInputFocused ? document.activeElement.selectionEnd : null;

  let html = `
    <div class="toolbar-row">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input id="pw-search-input" class="search-input" placeholder="Search passwords, accounts, URLs…" oninput="setPwSearch(this.value)" value="${esc(pwSearchFilter)}"/>
      </div>
      <div class="toolbar-actions">
        <button class="btn-sm" onclick="openPwGeneratorModal()" title="Instant strong password generator">⚡ Generator</button>
        <button class="btn-sm" onclick="openBreachAuditModal()" title="Check passwords against known data breaches">🛡️ Breach Check</button>
        <button class="btn-sm primary" onclick="showPasswordForm(null, 'login')">＋ New Login</button>
      </div>
    </div>

    <div class="task-filter-row" style="margin-bottom:14px;">
      <span style="font-size:11px;color:var(--muted);font-weight:600;display:flex;align-items:center;margin-right:2px;">FILTER:</span>
      ${['All', 'Logins', '2FA Active', 'Weak', 'Reused'].map(f => `
        <button class="filter-pill ${pwTypeFilter === f ? 'active' : ''}" onclick="setPwFilter('${f}')">
          ${f}
        </button>
      `).join('')}
    </div>
  `;

  if (filtered.length === 0) {
    html += `<div class="empty"><div class="empty-icon">🔑</div><div class="empty-text">No passwords found matching your filters.<br>Tap "＋ New Login" to save credentials.</div></div>`;
  } else {
    html += filtered.map(p => passwordCard(p)).join('');
  }

  content.innerHTML = html;

  if (isInputFocused) {
    const el = document.getElementById('pw-search-input');
    if (el) {
      el.focus();
      if (selStart !== null && selEnd !== null) el.setSelectionRange(selStart, selEnd);
    }
  }
}

function getCardBrand(num) {
  const clean = (num || '').replace(/\D/g, '');
  if (/^4/.test(clean)) return 'VISA';
  if (/^5[1-5]/.test(clean)) return 'MASTERCARD';
  if (/^3[47]/.test(clean)) return 'AMEX';
  if (/^6(?:011|5)/.test(clean)) return 'DISCOVER';
  return 'CARD';
}

function maskCardNumber(num) {
  const clean = (num || '').replace(/\D/g, '');
  if (clean.length < 4) return '•••• •••• •••• ••••';
  const last4 = clean.slice(-4);
  return `•••• •••• •••• ${last4}`;
}

async function loadAttachments(type, id) {
  const container = document.getElementById(`attach-${type}-${id}`);
  if (!container) return;
  const list = await api('GET', `/attachments/${type}/${id}`);
  if (!list.length) { container.innerHTML = '<span style="color:var(--muted);font-size:12px">No files attached</span>'; return; }
  container.innerHTML = list.map(a => `
    <div class="attach-chip" onclick="downloadAttach(${a.id}, '${esc(a.filename)}')">
      <span>📎</span> ${esc(a.filename)}
      <span class="attach-qr" style="margin-left:4px;cursor:pointer;padding:0 2px;" onclick="event.stopPropagation();showAttachmentQr(${a.id}, '${esc(a.filename)}', '${esc(a.mime_type||'')}')" title="Scan QR to Download on Phone">📱</span>
      <span class="attach-del" onclick="event.stopPropagation();deleteAttach(${a.id},'${type}',${id})">✕</span>
    </div>
  `).join('');
}

function startAttach(type, id) {
  pendingAttachItem = { type, id };
  document.getElementById('fileInput').click();
}

async function handleFileUpload(event) {
  const files = Array.from(event.target.files);
  if (!files.length || !pendingAttachItem) return;
  for (const file of files) {
    const content = await toBase64(file);
    await api('POST', '/attachments', {
      item_type: pendingAttachItem.type,
      item_id: pendingAttachItem.id,
      filename: file.name,
      content,
      mime_type: file.type
    });
  }
  loadAttachments(pendingAttachItem.type, pendingAttachItem.id);
  event.target.value = '';
  toast(`${files.length} file(s) attached`);
}

function toBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function downloadAttach(id, filename) {
  const data = await api('GET', `/attachments/download/${id}`);
  const a = document.createElement('a');
  a.href = data.content;
  a.download = filename;
  a.click();
}

async function deleteAttach(id, type, itemId) {
  if (!confirm('Remove attachment?')) return;
  await api('DELETE', `/attachments/delete/${id}`);
  loadAttachments(type, itemId);
  toast('Attachment removed');
}

    const dd = String(d.getDate()).padStart(2, '0');
    document.getElementById('f-due').value = `${yyyy}-${mm}-${dd}`;

function setReminderPreset(minutes) {

}

function generateStrongPassword(len = 18) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?';
  const bytes = new Uint8Array(len);
  crypto.getRandomValues(bytes);
  let pw = '';
  for (let i = 0; i < len; i++) {
    pw += chars[bytes[i] % chars.length];
  }
  const input = document.getElementById('f-password');
  if (input) {
    input.value = pw;
    input.type = 'text';
    toast('Generated strong 18-char password!');
  }
  return pw;
}

  const title = document.getElementById('f-title').value.trim();
  if (!title) return toast('Title is required');

  const reminderVal = document.getElementById('f-reminder')?.value || null;
  const recurringVal = document.getElementById('f-recurring')?.value || 'none';
  const colorVal = document.getElementById('f-color')?.value || null;

  const body = {
    title,
    description: document.getElementById('f-desc').value.trim(),
    due_date: document.getElementById('f-due').value || null,
    reminder_time: reminderVal ? new Date(reminderVal).toISOString() : null,
    recurring: recurringVal,
    color: colorVal,
    priority: document.getElementById('f-priority').value,
    category: document.getElementById('f-category').value || 'General',
    completed: 0,
    reminder_dismissed: 0
  };
  if (editingId) {
    const todos = await api('GET', '/todos');
    const t = todos.find(x => x.id === editingId);
    let existingSubtasks = t?.subtasks;
    if (typeof existingSubtasks === 'string') {
      try { existingSubtasks = JSON.parse(existingSubtasks); } catch (_) { existingSubtasks = []; }
    }
    await api('PUT', '/todos/' + editingId, { 
      ...body, 
      completed: t?.completed || 0,
      subtasks: existingSubtasks || []
    });
    toast('Task updated');
  } else {
    await api('POST', '/todos', { ...body, subtasks: [] });
    toast('Task added');
  }
  closeModal();
  renderTodos();
}

// ---- 2FA / TOTP ENGINE (RFC 6238) ----
function base32ToBytes(base32) {
  if (!base32) return new Uint8Array(0);
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  let clean = base32.toUpperCase().replace(/[\s-]/g, '').replace(/=+$/, '');
  let bits = 0, value = 0;
  const bytes = [];
  for (let i = 0; i < clean.length; i++) {
    const val = alphabet.indexOf(clean[i]);
    if (val === -1) continue;
    value = (value << 5) | val;
    bits += 5;
    if (bits >= 8) {
      bytes.push((value >>> (bits - 8)) & 255);
      bits -= 8;
    }
  }
  return new Uint8Array(bytes);
}

function generateRandomBase32(length = 16) {
  const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  let result = '';
  const bytes = new Uint8Array(length);
  crypto.getRandomValues(bytes);
  for (let i = 0; i < length; i++) {
    result += alphabet[bytes[i] % 32];
  }
  return result;
}

async function computeTOTP(secret) {
  try {
    const keyBytes = base32ToBytes(secret);
    if (!keyBytes || keyBytes.length === 0) return null;
    const epoch = Math.floor(Date.now() / 1000);
    const step = 30;
    const counter = Math.floor(epoch / step);
    const secondsRemaining = step - (epoch % step);

    const counterBuffer = new ArrayBuffer(8);
    const counterView = new DataView(counterBuffer);
    counterView.setUint32(0, 0);
    counterView.setUint32(4, counter);

    const key = await crypto.subtle.importKey(
      'raw',
      keyBytes,
      { name: 'HMAC', hash: { name: 'SHA-1' } },
      false,
      ['sign']
    );

    const signature = await crypto.subtle.sign('HMAC', key, counterBuffer);
    const hash = new Uint8Array(signature);
    const offset = hash[hash.length - 1] & 0x0f;
    const binary = ((hash[offset] & 0x7f) << 24) |
                   ((hash[offset + 1] & 0xff) << 16) |
                   ((hash[offset + 2] & 0xff) << 8) |
                   (hash[offset + 3] & 0xff);
    const otp = (binary % 1000000).toString().padStart(6, '0');
    return {
      formatted: `${otp.slice(0, 3)} ${otp.slice(3)}`,
      raw: otp,
      remaining: secondsRemaining
    };
  } catch (err) {
    return null;
  }
}

async function copyTotpCode(id) {
  const el = document.getElementById('totp-pw-' + id);
  if (!el) return;
  const secret = el.getAttribute('data-secret');
  if (!secret) return;
  const res = await computeTOTP(secret);
  if (res) {
    copyText(res.raw);
    toast('2FA code copied: ' + res.raw);
  }
}

let totpInterval = null;
function startTotpTicker() {
  if (totpInterval) clearInterval(totpInterval);
  totpInterval = setInterval(async () => {
    const widgets = document.querySelectorAll('.totp-widget[data-secret]');
    if (!widgets.length) return;
    for (const w of widgets) {
      const secret = w.getAttribute('data-secret');
      if (!secret) continue;
      const res = await computeTOTP(secret);
      if (!res) continue;
      const codeEl = w.querySelector('.totp-code');
      const pieEl = w.querySelector('.totp-pie');
      if (codeEl) codeEl.textContent = res.formatted;
      if (pieEl) {
        pieEl.textContent = res.remaining + 's';
        pieEl.style.background = res.remaining <= 5 ? 'rgba(239, 68, 68, 0.2)' : res.remaining <= 10 ? 'rgba(245, 158, 11, 0.2)' : 'rgba(34, 197, 94, 0.2)';
        pieEl.style.color = res.remaining <= 5 ? 'var(--red)' : res.remaining <= 10 ? 'var(--orange)' : 'var(--green)';
      }
    }
  }, 1000);
}
startTotpTicker();

async function triggerGenerateImage() {
  const input = document.getElementById('studioPromptInput');
  const prompt = input?.value.trim();
  if (!prompt) return toast('Please enter a description for the image');

  const btn = document.getElementById('btnGenImage');
  const display = document.getElementById('studioActiveDisplay');

  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span>⏳</span> Rendering…';
  }

  if (display) {
    display.innerHTML = `
      <div class="studio-img-preview" style="flex-direction:column;gap:14px;padding:50px 20px;">
        <div style="font-size:40px;" class="pulse">✨</div>
        <div style="font-size:14px;font-weight:600;color:var(--text);">Generating High-Fidelity Visual…</div>
        <div style="font-size:12px;color:var(--muted);text-align:center;">Prompt: "${esc(prompt)}"</div>
      </div>
    `;
  }

  try {
    const res = await api('POST', '/images/generate', {
      prompt,
      aspect_ratio: currentImageRatio,
      style: currentImageStyle
    });

    if (res.success && res.imageUrl) {
      const artItem = {
        imageUrl: res.imageUrl,
        prompt,
        ratio: currentImageRatio,
        style: currentImageStyle,
        provider: res.provider || 'AI',
        createdAt: new Date().toLocaleTimeString()
      };
      currentGeneratedImage = artItem;
      generatedImagesGallery.unshift(artItem);
      toast('Visual generated successfully!');
      renderImageStudio();
    } else {
      toast('Generation failed: ' + (res.error || 'Unknown error'));
      renderImageStudio();
    }
  } catch (err) {
    toast('Generation error: ' + err.message);
    renderImageStudio();
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '🎨 Generate';
    }
  }
}

async function triggerWebImageSearch() {

  isSearchingWebImages = true;

  if (gridWrapper) gridWrapper.innerHTML = renderWebImagesContent();

  const btn = document.getElementById('btnWebImgSearch');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span>⏳</span> Searching…';
  }

  try {
    const res = await fetch(`/api/images/search?q=${encodeURIComponent(webImageQuery)}&source=${encodeURIComponent(webImageSource)}&limit=24`, {
      headers: { 'Authorization': 'Bearer ' + masterKey }
    });
    const data = await res.json();
    if (data && data.success && Array.isArray(data.images)) {
      webImageResults = data.images;
      if (webImageResults.length > 0) {
        toast(`✓ Found ${webImageResults.length} images for "${webImageQuery}"`);

        toast('No matching images found.');

      toast('Search response error: ' + (data?.error || 'Failed to fetch'));

  } catch (err) {
    console.warn('Web image search error:', err);
    toast('Image search network error: ' + err.message);
  } finally {
    isSearchingWebImages = false;
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '<span>🔍</span> Search Images';
    }
    const wrap = document.getElementById('webImagesGridWrapper');
    if (wrap) wrap.innerHTML = renderWebImagesContent();
  }

async function saveWebImageToDriveByIndex(idx) {
  const item = webImageResults[idx];
  if (!item) return;

  toast(`Saving "${item.title.substring(0, 20)}…" to Vault Drive…`);
  try {
    // Fetch image as blob and upload as base64 to /uploads
    const res = await fetch(item.imageUrl);
    const blob = await res.blob();
    const cleanName = (item.title || 'web_image').replace(/[^a-zA-Z0-9_-]/g, '_').substring(0, 30) + (blob.type.includes('png') ? '.png' : '.jpg');
    
    const reader = new FileReader();
    reader.onload = async () => {
      const base64 = reader.result;
      const uploaded = await api('POST', '/uploads', {
        filename: cleanName,
        content: base64,
        mime_type: blob.type || 'image/jpeg',
        item_type: 'file',
        item_id: 0
      });
      toast(`✓ Saved "${cleanName}" to Vault Drive!`);
      if (uploaded && uploaded.id) {
        showAttachmentQr(uploaded.id, cleanName, blob.type);
      }
    };
    reader.readAsDataURL(blob);
  } catch (err) {
    // If CORS prevents direct blob download in browser, store via URL reference
    console.warn('Direct blob fetch blocked by CORS, saving note reference:', err);
    try {
      await api('POST', '/passwords', {
        title: 'Saved Image: ' + item.title,
        username: item.author || 'Web',
        password: item.source || 'Web Image',
        url: item.imageUrl,
        description: `Image URL: ${item.imageUrl}\nLicense: ${item.license}\nSource: ${item.source}`,
        item_type: 'note'
      });
      toast('✓ Saved image bookmark into Vault Notes!');
    } catch (e2) {
      toast('Could not save image: ' + err.message);
    }
  }
}

async function confirmAttachWebImage(idx) {
  const item = webImageResults[idx];
  const targetVal = document.getElementById('attachWebImgTarget')?.value;
  if (!targetVal || !item) return toast('Please select an item');
  const [type, id] = targetVal.split(':');

  closeModal();
  toast('Attaching image…');

  try {
    // Attempt to download and attach base64 or fallback to direct URL
    let content = item.imageUrl;
    try {
      const resp = await fetch(item.imageUrl);
      if (resp.ok) {
        const blob = await resp.blob();
        content = await toBase64(blob);
      }
    } catch (_) {}

    await api('POST', '/attachments', {
      item_type: type,
      item_id: parseInt(id),
      filename: (item.title || 'image').replace(/[^a-zA-Z0-9_-]/g, '_').substring(0, 24) + '.jpg',
      content: content,
      mime_type: 'image/jpeg'
    });
    toast(`✓ Image attached to ${type} #${id}!`);
  } catch (err) {
    toast('Error attaching image: ' + err.message);
  }
}

function extractYouTubeVideoId(input) {
  if (!input) return null;
  const str = input.trim();
  // If already clean 11 char ID
  if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;
  // youtu.be/ID
  const shortMatch = str.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/i);
  if (shortMatch) return shortMatch[1];
  // youtube.com/(watch|shorts|embed|live)
  const urlMatch = str.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts|live)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
  if (urlMatch) return urlMatch[1];
  return null;
}

function toggleSongPreview(trackId, previewUrl, trackTitle, artistName) {
  if (currentPreviewTrackId === trackId && isPreviewPlaying) {
    pauseSongPreview();
    return;
  }

  // Stop any active radio stream
  if (typeof isRadioPlaying !== 'undefined' && isRadioPlaying && typeof pauseRadio === 'function') {
    pauseRadio();
  }

  if (currentPreviewAudio) {
    currentPreviewAudio.pause();
    currentPreviewAudio = null;
  }

  currentPreviewTrackId = trackId;
  currentPreviewAudio = new Audio(previewUrl);
  currentPreviewAudio.volume = typeof radioVolume !== 'undefined' ? radioVolume : 0.85;

  toast(`🎧 Playing preview: ${trackTitle} - ${artistName}`);
  currentPreviewAudio.play().then(() => {
    isPreviewPlaying = true;
    updateSongPreviewUi();
  }).catch(err => {
    isPreviewPlaying = false;
    toast(`Preview playback failed: ${err.message}`);
    updateSongPreviewUi();
  });

  currentPreviewAudio.onended = () => {
    isPreviewPlaying = false;
    currentPreviewTrackId = null;
    updateSongPreviewUi();
  };
  currentPreviewAudio.onpause = () => {
    isPreviewPlaying = false;
    updateSongPreviewUi();
  };
}

function pauseSongPreview() {
  if (currentPreviewAudio) {
    currentPreviewAudio.pause();
  }
  isPreviewPlaying = false;
  updateSongPreviewUi();
}

function updateSongPreviewUi() {
  document.querySelectorAll('.song-card').forEach(c => c.classList.remove('previewing'));
  if (currentPreviewTrackId && isPreviewPlaying) {
    const el = document.getElementById(`songCard-${currentPreviewTrackId}`);
    if (el) el.classList.add('previewing');
  }
}

async function streamSongOnYouTube(songName, artistName) {
  toast(`🔍 Resolving official full song: "${songName}" by ${artistName}…`);
  try {
    const res = await fetch(`${API}/music/song-to-yt?song=${encodeURIComponent(songName)}&artist=${encodeURIComponent(artistName)}`);
    const data = await res.json();
    if (!res.ok || !data.success) {
      throw new Error(data.error || 'Full song not found on YouTube');
    }

    // Stop 30s preview audio if active
    pauseSongPreview();

    // Play official full YouTube video
    playYouTubeVideo(data.videoId, `${songName} - ${artistName}`, data.channelTitle || 'Official Music');
    toast(`✓ Now streaming full track: ${songName}!`);
  } catch (err) {
    toast(`Failed to resolve full song: ${err.message}`);
  }
}

function playYouTubeVideo(id, title = 'YouTube Video', channel = 'YouTube', channelId = '') {
  currentYtVideoId = id;
  currentYtTitle = title;
  currentYtChannel = channel;
  if (channelId) currentYtChannelId = channelId;
  isYtPlaying = true;

  // Pause audio radio stream if currently active to avoid clashing sound
  if (typeof isRadioPlaying !== 'undefined' && isRadioPlaying && typeof pauseRadio === 'function') {
    pauseRadio();
  }

  // Record in History
  const existingIdx = ytHistory.findIndex(h => h.id === id);
  if (existingIdx >= 0) ytHistory.splice(existingIdx, 1);
  ytHistory.unshift({
    id,
    title,
    channel,
    channelId: channelId || '',
    playedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  });
  if (ytHistory.length > 20) ytHistory.pop();
  try {
    localStorage.setItem('vault_yt_history', JSON.stringify(ytHistory));
    fetch('/api/settings/set', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: 'vault_yt_history', value: ytHistory })
    }).catch(() => {});
  } catch (_) {}

  // If in YouTube tab, update player
  if (currentTab === 'ytplayer') {
    renderYouTubeStudio();
  } else {
    // If user is in another tab, update and show mini player
    floatYtToMini();
  }

  toast(`▶ Now playing: ${title}`);
}

function addToYtQueue(id, title, channel, thumbnail, duration, channelId) {
  ytQueue.push({
    id,
    title,
    channel,
    thumbnail: thumbnail || `https://img.youtube.com/vi/${id}/mqdefault.jpg`,
    duration: duration || '',
    channelId: channelId || ''
  });

  const tabBtn = document.getElementById('ytQueueTabBtn');
  if (tabBtn) {
    tabBtn.textContent = `📋 Up Next Queue (${ytQueue.length})`;
  }

  if (currentTab === 'ytplayer' && ytActiveMode === 'queue') {
    const wrap = document.getElementById('ytQueueWrap');
    if (wrap) wrap.innerHTML = renderYtQueueList();
  }

  toast(`✓ Added to playback queue: ${title}`);
}

async function queueSongToYouTube(songName, artistName) {
  toast(`🔍 Adding "${songName}" by ${artistName} to queue…`);
  try {
    const res = await fetch(`${API}/music/song-to-yt?song=${encodeURIComponent(songName)}&artist=${encodeURIComponent(artistName)}`);
    const data = await res.json();
    if (!res.ok || !data.success) {
      throw new Error(data.error || 'Full song not found on YouTube');
    }
    addToYtQueue(data.videoId, `${songName} - ${artistName}`, data.channelTitle || 'Official Music', `https://img.youtube.com/vi/${data.videoId}/mqdefault.jpg`, '', '');
  } catch (err) {
    toast(`Failed to queue song: ${err.message}`);
  }
}

function renderYtQueueList() {
  if (ytQueue.length === 0) {
    return `
      <div style="text-align:center;padding:36px 0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px;">
        <span style="font-size:36px;">📋</span>
        <div>Your playback queue is currently empty.</div>
        <div style="font-size:12px;">Click <strong>➕ Queue</strong> on any search result, trending video, or music track to build your continuous playlist!</div>
      </div>
    `;
  }

  return `
    <div class="yt-queue-list">
      ${ytQueue.map((item, idx) => `
        <div class="yt-queue-item">
          <div class="yt-queue-item-index">#${idx + 1}</div>
          <img class="yt-queue-item-thumb" src="${esc(item.thumbnail)}" alt="Thumb" onerror="this.src='https://img.youtube.com/vi/${item.id}/mqdefault.jpg'"/>
          <div class="yt-queue-item-info">
            <div class="yt-queue-item-title" title="${esc(item.title)}">${esc(item.title)}</div>
            <div class="yt-queue-item-channel">${esc(item.channel)}${item.duration ? ` • ${esc(item.duration)}` : ''}</div>
          </div>
          <div class="yt-queue-item-actions">
            <button class="btn btn-primary" style="padding:4px 10px;font-size:11px;" onclick="playQueueItemAt(${idx})" title="Play this video immediately">
              ▶ Play Now
            </button>
            <button class="filter-pill" style="font-size:11px;padding:3px 7px;" onclick="removeFromYtQueue(${idx})" title="Remove from queue">
              ✕ Remove
            </button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function playNextInQueue() {
  if (ytQueue.length === 0) {
    return toast('Queue is empty');
  }
  const nextItem = ytQueue.shift();
  playYouTubeVideo(nextItem.id, nextItem.title, nextItem.channel, nextItem.channelId);

  const tabBtn = document.getElementById('ytQueueTabBtn');
  if (tabBtn) {
    tabBtn.textContent = `📋 Up Next Queue ${ytQueue.length > 0 ? `(${ytQueue.length})` : ''}`;
  }

  if (currentTab === 'ytplayer' && ytActiveMode === 'queue') {
    const wrap = document.getElementById('ytQueueWrap');
    if (wrap) wrap.innerHTML = renderYtQueueList();
  }
}

function playQueueItemAt(index) {
  if (index < 0 || index >= ytQueue.length) return;
  const item = ytQueue.splice(index, 1)[0];
  playYouTubeVideo(item.id, item.title, item.channel, item.channelId);

  const tabBtn = document.getElementById('ytQueueTabBtn');
  if (tabBtn) {
    tabBtn.textContent = `📋 Up Next Queue ${ytQueue.length > 0 ? `(${ytQueue.length})` : ''}`;
  }

  if (currentTab === 'ytplayer' && ytActiveMode === 'queue') {
    const wrap = document.getElementById('ytQueueWrap');
    if (wrap) wrap.innerHTML = renderYtQueueList();
  }
}

function removeFromYtQueue(index) {
  if (index < 0 || index >= ytQueue.length) return;
  ytQueue.splice(index, 1);

  const tabBtn = document.getElementById('ytQueueTabBtn');
  if (tabBtn) {
    tabBtn.textContent = `📋 Up Next Queue ${ytQueue.length > 0 ? `(${ytQueue.length})` : ''}`;
  }

  if (currentTab === 'ytplayer' && ytActiveMode === 'queue') {
    const wrap = document.getElementById('ytQueueWrap');
    if (wrap) wrap.innerHTML = renderYtQueueList();
  }
  toast('Item removed from queue');
}

function clearYtQueue() {
  if (ytQueue.length === 0) return;
  ytQueue = [];
  const tabBtn = document.getElementById('ytQueueTabBtn');
  if (tabBtn) {
    tabBtn.textContent = '📋 Up Next Queue';
  }
  if (currentTab === 'ytplayer' && ytActiveMode === 'queue') {
    const wrap = document.getElementById('ytQueueWrap');
    if (wrap) wrap.innerHTML = renderYtQueueList();
  }
  toast('Queue cleared');
}

function shuffleYtQueue() {
  if (ytQueue.length <= 1) return toast('Queue needs at least 2 videos to shuffle');
  for (let i = ytQueue.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [ytQueue[i], ytQueue[j]] = [ytQueue[j], ytQueue[i]];
  }
  if (currentTab === 'ytplayer' && ytActiveMode === 'queue') {
    const wrap = document.getElementById('ytQueueWrap');
    if (wrap) wrap.innerHTML = renderYtQueueList();
  }
  toast('🔀 Queue shuffled!');
}

function toggleYtLoop() {
  isYtLooping = !isYtLooping;
  toast(`Loop mode: ${isYtLooping ? 'ENABLED (Video will repeat on finish)' : 'DISABLED'}`);
  if (currentTab === 'ytplayer') {
    renderYouTubeStudio();
  }
}

// Listen for YouTube Iframe player state events (for queue autoplay & loop)
if (typeof window !== 'undefined') {
  window.addEventListener('message', (event) => {
    if (typeof event.data !== 'string') return;
    try {
      const data = JSON.parse(event.data);
      if (data && data.event === 'onStateChange') {
        // State 0 = ended
        if (data.info === 0) {
          if (isYtLooping) {
            toast('🔁 Repeating video (Loop mode active)…');
            playYouTubeVideo(currentYtVideoId, currentYtTitle, currentYtChannel, currentYtChannelId);
          } else if (ytQueue.length > 0) {
            toast('⏭️ Playing next queued track…');
            playNextInQueue();
          }
        }
      }
    } catch (_) {}
  });
}

function updateTtsWordCount() {
  const text = document.getElementById('ttsTextInput')?.value || '';
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const chars = text.length;
  const el = document.getElementById('ttsWordCount');
  if (el) el.textContent = `${words} words • ${chars} characters`;
}

function triggerTtsStudioSpeak() {
  const text = document.getElementById('ttsTextInput')?.value || '';
  if (!text.trim()) return toast('Please enter some text to read aloud');
  speakText(text, {
    rate: ttsRate,
    pitch: ttsPitch,
    voiceUri: ttsSelectedVoiceUri
  });
}

function clearTtsText() {
  const input = document.getElementById('ttsTextInput');
  if (input) {
    input.value = '';
    input.focus();
    updateTtsWordCount();
  }
}

function formatBytes(bytes) {
  if (!bytes || bytes <= 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

async function handleVaultDriveUpload(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  const autoZip = document.getElementById('chkAutoZipBigFiles')?.checked ?? true;
  await processFilesForDrive(files, false, autoZip);
  event.target.value = '';
}

function promptBundleZipUpload() {
  document.getElementById('bundleZipFileInput')?.click();
}

async function handleBundleZipUpload(event) {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  toast(`Compressing ${files.length} file(s) into single ZIP archive…`);
  try {
    const zip = new JSZip();
    for (const file of files) {
      zip.file(file.name, file);
    }
    const zipBlob = await zip.generateAsync({
      type: 'blob',
      compression: 'DEFLATE',
      compressionOptions: { level: 9 }
    });
    const zipName = `vault_bundle_${new Date().toISOString().slice(0,10)}_${Date.now().toString().slice(-4)}.zip`;
    const zipFile = new File([zipBlob], zipName, { type: 'application/zip' });
    await processFilesForDrive([zipFile], true, false);
    toast(`✓ Bundled & uploaded ${zipName}!`);
  } catch(err) {
    toast('ZIP bundle error: ' + err.message);
  }
  event.target.value = '';
}

async function handleVaultDriveDrop(e) {
  e.preventDefault();
  document.getElementById('driveDropzone')?.classList.remove('dragover');
  const files = Array.from(e.dataTransfer.files || []);
  if (!files.length) return;
  const autoZip = document.getElementById('chkAutoZipBigFiles')?.checked ?? true;
  await processFilesForDrive(files, false, autoZip);
}

async function processFilesForDrive(files, forceSingle = false, autoZipBig = true) {
  toast(`Processing ${files.length} file(s) for secure drive…`);
  let successCount = 0;
  let latestFileId = null;
  let latestFileName = null;

  for (const originalFile of files) {
    let fileToUpload = originalFile;
    let isCompressed = false;

    // Check if we should compress this file to ZIP
    if (!originalFile.name.toLowerCase().endsWith('.zip') && (autoZipBig && originalFile.size > 300 * 1024)) {
      try {
        toast(`Compressing ${originalFile.name} to ZIP…`);
        const zip = new JSZip();
        zip.file(originalFile.name, originalFile);
        const zipBlob = await zip.generateAsync({
          type: 'blob',
          compression: 'DEFLATE',
          compressionOptions: { level: 9 }
        });
        const zipName = originalFile.name.replace(/\.[^/.]+$/, '') + '.zip';
        fileToUpload = new File([zipBlob], zipName, { type: 'application/zip' });
        isCompressed = true;
      } catch(err) {
        console.warn('Zip compression fallback:', err);
      }
    }

    try {
      const content = await toBase64(fileToUpload);
      const res = await api('POST', '/uploads', {
        filename: fileToUpload.name,
        content,
        mime_type: fileToUpload.type || (isCompressed ? 'application/zip' : 'application/octet-stream'),
        item_type: 'file',
        item_id: 0
      });
      if (res && res.id) {
        successCount++;
        latestFileId = res.id;
        latestFileName = fileToUpload.name;
      }
    } catch (err) {
      console.warn('Failed to upload file:', originalFile.name, err);
    }
  }

  toast(`✓ Saved ${successCount} file(s) to Vault Drive!`);
  await renderUploadsStudio();

  // If single file uploaded, automatically prompt QR code for mobile convenience
  if (files.length === 1 && latestFileId) {
    showAttachmentQr(latestFileId, latestFileName, 'application/zip');
  }
}

// Compress any existing file into ZIP and open QR Code modal
async function zipAndShareDriveFile(id, filename) {
  if (filename.toLowerCase().endsWith('.zip')) {
    return showAttachmentQr(id, filename, 'application/zip');
  }

  toast(`Compressing ${filename} into ZIP for mobile QR sharing…`);
  try {
    const rawRes = await fetch(`/api/attachments/raw/${id}`);
    if (!rawRes.ok) throw new Error('Could not fetch file content');
    const blob = await rawRes.blob();

    const zip = new JSZip();
    zip.file(filename, blob);
    const zipBlob = await zip.generateAsync({
      type: 'blob',
      compression: 'DEFLATE',
      compressionOptions: { level: 9 }
    });

    const origBytes = blob.size;
    const zipBytes = zipBlob.size;
    const savingsPercent = Math.max(0, Math.round(((origBytes - zipBytes) / origBytes) * 100));

    const zipFilename = filename.replace(/\.[^/.]+$/, '') + '.zip';
    const zipFile = new File([zipBlob], zipFilename, { type: 'application/zip' });
    const contentB64 = await toBase64(zipFile);

    const uploaded = await api('POST', '/uploads', {
      filename: zipFilename,
      content: contentB64,
      mime_type: 'application/zip',
      item_type: 'file',
      item_id: 0
    });

    toast(`✓ Created ZIP! (${formatBytes(origBytes)} → ${formatBytes(zipBytes)}, ${savingsPercent}% saved)`);
    await renderUploadsStudio();

    if (uploaded && uploaded.id) {
      showAttachmentQr(uploaded.id, zipFilename, 'application/zip');
    }
  } catch(err) {
    toast('Zip & QR failed: ' + err.message);
  }
}

// Export entire drive files as a single ZIP archive
async function exportAllDriveAsZip() {
  if (!driveFiles || driveFiles.length === 0) {
    return toast('No files to export in Vault Drive');
  }
  toast(`Packaging ${driveFiles.length} file(s) into master ZIP archive…`);
  try {
    const zip = new JSZip();
    for (const f of driveFiles) {
      try {
        const rawRes = await fetch(`/api/attachments/raw/${f.id}`);
        if (rawRes.ok) {
          const blob = await rawRes.blob();
          zip.file(f.filename, blob);
        }
      } catch(_) {}
    }
    const masterBlob = await zip.generateAsync({
      type: 'blob',
      compression: 'DEFLATE',
      compressionOptions: { level: 6 }
    });
    const url = URL.createObjectURL(masterBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vault_drive_all_${new Date().toISOString().slice(0,10)}.zip`;
    a.click();
    URL.revokeObjectURL(url);
    toast('✓ Master ZIP archive downloaded!');
  } catch(err) {
    toast('Failed to package ZIP: ' + err.message);
  }
}

async function deleteDriveFile(id) {
  if (!confirm('Permanently delete this file from your vault drive?')) return;
  try {
    await api('DELETE', `/uploads/${id}`);

    await renderUploadsStudio();

}

async function readAloudDriveFile(id, filename) {
  try {
    toast(`Fetching ${filename} to read aloud…`);
    const data = await api('GET', `/attachments/download/${id}`);
    let text = data.content || '';
    if (text.includes(',')) {
      const b64 = text.split(',')[1];
      try {
        text = decodeURIComponent(escape(atob(b64)));
      } catch(_) {
        text = atob(b64);
      }
    }
    speakText(`Reading file ${filename}. Content: ${text.substring(0, 1500)}`);
  } catch (err) {
    toast('Cannot read file: ' + err.message);
  }
}

function drawGenerativeVideoFrame(ctx, w, h, preset, t) {
  // Clear with deep space darkness
  ctx.fillStyle = '#05070d';
  ctx.fillRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2;

  if (preset === 'shield') {
    // Cyber Shield Hologram
    ctx.save();
    // Grid background
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.08)';
    ctx.lineWidth = 1;
    for (let x = 0; x < w; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
    for (let y = 0; y < h; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }

    // Pulsing shield rings
    for (let i = 1; i <= 3; i++) {
      const r = 50 + i * 35 + Math.sin(t * 2 + i) * 8;
      ctx.beginPath();
      ctx.arc(cx, cy, r, t * (i % 2 === 0 ? 1 : -1), t * (i % 2 === 0 ? 1 : -1) + Math.PI * 1.5);
      ctx.strokeStyle = i === 1 ? '#38bdf8' : i === 2 ? '#7c6af7' : '#10b981';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 12;
      ctx.stroke();
    }

    // Hexagonal Vault Shield
    ctx.beginPath();
    const sides = 6;
    const hexRadius = 60 + Math.sin(t * 3) * 4;
    for (let i = 0; i < sides; i++) {
      const angle = (i * 2 * Math.PI) / sides - Math.PI / 2;
      const x = cx + hexRadius * Math.cos(angle);
      const y = cy + hexRadius * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = '#7c6af7';
    ctx.lineWidth = 4;
    ctx.fillStyle = 'rgba(124, 106, 247, 0.15)';
    ctx.fill();
    ctx.stroke();

    // Shield Emblem Icon
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🔒', cx, cy);

    ctx.font = 'bold 12px "JetBrains Mono", monospace';
    ctx.fillStyle = '#38bdf8';
    ctx.fillText('AES-256 ENCRYPTION ACTIVE', cx, cy + 90);
    ctx.restore();
  } else if (preset === 'matrix') {
    // Matrix Cyber Rain
    ctx.save();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
    ctx.fillRect(0, 0, w, h);
    ctx.font = '14px "JetBrains Mono", monospace';
    const cols = 36;
    for (let i = 0; i < cols; i++) {
      const colX = i * 18 + 10;
      const speed = 15 + ((i * 13) % 25);
      const y = ((t * speed * 25 + (i * 97)) % (h + 80)) - 40;
      const char = String.fromCharCode(0x30A0 + Math.floor(Math.sin(t + i) * 40 + 50));
      ctx.fillStyle = '#4ade80';
      ctx.shadowColor = '#22c55e';
      ctx.shadowBlur = 8;
      ctx.fillText(char, colX, y);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(char, colX, y + 14);
    }
    ctx.restore();
  } else if (preset === 'quantum') {
    // Quantum Core Pulse
    ctx.save();
    const glow = Math.abs(Math.sin(t * 2));
    const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, 120);
    grad.addColorStop(0, '#f59e0b');
    grad.addColorStop(0.4, 'rgba(234, 88, 12, 0.4)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // Orbiting electron particles
    for (let ring = 0; ring < 4; ring++) {
      ctx.beginPath();
      ctx.ellipse(cx, cy, 90 + ring * 20, 30 + ring * 10, (t * 0.8 + ring * 1.2), 0, Math.PI * 2);
      ctx.strokeStyle = ring % 2 === 0 ? '#38bdf8' : '#f59e0b';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Electron
      const ex = cx + (90 + ring * 20) * Math.cos(t * 2 + ring * 2);
      const ey = cy + (30 + ring * 10) * Math.sin(t * 2 + ring * 2);
      ctx.beginPath();
      ctx.arc(ex, ey, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 10;
      ctx.fill();
    }

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🗝️', cx, cy);
    ctx.restore();
  } else if (preset === 'steampunk') {
    // Steampunk Clockwork
    ctx.save();
    function drawGear(gx, gy, r, teeth, rot, color) {
      ctx.save();
      ctx.translate(gx, gy);
      ctx.rotate(rot);
      ctx.fillStyle = color;
      ctx.beginPath();
      for (let i = 0; i < teeth; i++) {
        const a1 = (i * 2 * Math.PI) / teeth;
        const a2 = a1 + Math.PI / teeth;
        ctx.arc(0, 0, r + 8, a1, a1 + 0.1);
        ctx.arc(0, 0, r, a2, a2 + 0.1);
      }
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.35, 0, Math.PI * 2);
      ctx.fillStyle = '#05070d';
      ctx.fill();
      ctx.restore();
    }
    drawGear(cx - 70, cy, 65, 16, t, '#d97706');
    drawGear(cx + 60, cy + 30, 50, 12, -t * 1.33, '#b45309');
    drawGear(cx + 20, cy - 65, 40, 10, t * 1.6, '#f59e0b');
    ctx.restore();
  } else if (preset === 'biometric') {
    // Biometric Laser Sweep
    ctx.save();
    for (let r = 20; r <= 100; r += 16) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, -Math.PI * 0.8, Math.PI * 0.8);
      ctx.strokeStyle = 'rgba(6, 182, 212, 0.4)';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
    const laserY = cy - 90 + ((t * 80) % 180);
    ctx.beginPath();
    ctx.moveTo(cx - 120, laserY);
    ctx.lineTo(cx + 120, laserY);
    ctx.strokeStyle = '#22d3ee';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#06b6d4';
    ctx.shadowBlur = 14;
    ctx.stroke();
    ctx.fillStyle = '#22d3ee';
    ctx.font = 'bold 12px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('BIOMETRIC FINGERPRINT SCAN: 100% MATCH', cx, cy + 120);
    ctx.restore();
  } else {
    // Hyperspace Warp
    ctx.save();
    for (let i = 0; i < 90; i++) {
      const angle = (i * 137.5) * (Math.PI / 180);
      const dist = ((t * 180 + i * 25) % (w / 1.5));
      const sx = cx + Math.cos(angle) * dist;
      const sy = cy + Math.sin(angle) * dist;
      const prevDist = Math.max(0, dist - 15);
      const px = cx + Math.cos(angle) * prevDist;
      const py = cy + Math.sin(angle) * prevDist;

      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(sx, sy);
      ctx.strokeStyle = i % 3 === 0 ? '#38bdf8' : i % 2 === 0 ? '#7c6af7' : '#ffffff';
      ctx.lineWidth = 1 + (dist / 100);
      ctx.stroke();
    }
    ctx.restore();
  }
}

async function recordGenerativeVideo() {
  if (isVideoRecording || !videoCanvas) return;
  isVideoRecording = true;

  const btn = document.getElementById('btnRecordVideo');
  const progressBar = document.getElementById('videoProgressBar');
  const progressFill = document.getElementById('videoProgressFill');
  const badge = document.getElementById('videoLiveBadge');

  if (btn) btn.disabled = true;
  if (progressBar) progressBar.style.display = 'block';
  if (badge) {
    badge.textContent = '● RECORDING 60FPS…';
    badge.style.background = 'rgba(239, 68, 68, 0.8)';
    badge.style.borderColor = 'var(--red)';
  }

  try {
    const stream = videoCanvas.captureStream(30);
    const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' :
                     MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : 'video/mp4';
    const recorder = new MediaRecorder(stream, { mimeType });
    const chunks = [];

    recorder.ondataavailable = (e) => {
      if (e.data.size > 0) chunks.push(e.data);
    };

    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: mimeType });
      recordedVideoUrl = URL.createObjectURL(blob);
      toast('✓ Video rendered and recorded successfully!');

      // Update UI with recorded video
      const wrapper = document.getElementById('videoCanvasWrapper');
      if (wrapper) {
        wrapper.innerHTML = `
          <video controls autoplay loop style="max-width:100%;border-radius:8px;display:block;" src="${recordedVideoUrl}"></video>
          <div class="video-badge" style="background:rgba(16,185,129,0.8);border-color:var(--green);">✓ RENDER COMPLETE</div>
        `;
      }

      const actions = document.getElementById('videoExportActions');
      if (actions) actions.style.display = 'flex';
      const link = document.getElementById('videoDownloadLink');
      if (link) {
        link.href = recordedVideoUrl;
        link.download = `vault_${currentVideoPreset}_${Date.now()}.webm`;
      }

      if (progressBar) progressBar.style.display = 'none';
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<span>🎬</span> Re-Record Video';
      }
      isVideoRecording = false;
    };

    recorder.start();

    // 4 seconds recording duration with progress bar
    let elapsed = 0;
    const total = 4000;
    const interval = setInterval(() => {
      elapsed += 100;
      const pct = Math.min(100, Math.round((elapsed / total) * 100));
      if (progressFill) progressFill.style.width = pct + '%';
      if (elapsed >= total) {
        clearInterval(interval);
        recorder.stop();
      }
    }, 100);

  } catch (err) {
    toast('Recording error: ' + err.message);
    if (btn) btn.disabled = false;
    if (progressBar) progressBar.style.display = 'none';
    isVideoRecording = false;
  }
}

async function saveVideoToVaultDrive() {
  if (!recordedVideoUrl) return toast('Record a video first');

    const blob = await fetch(recordedVideoUrl).then(r => r.blob());

    reader.onload = async () => {

      await api('POST', '/uploads', {

        mime_type: 'video/webm',
        item_type: 'file',

  }
}

function playCyberSound(type) {
  const ctx = getAudioContext();
  const now = ctx.currentTime;
  activeSoundType = type;

  // Flash card UI
  document.querySelectorAll('.sound-card').forEach(c => c.classList.remove('playing'));
  const card = document.getElementById(`sound-card-${type}`);
  if (card) {
    card.classList.add('playing');
    setTimeout(() => card.classList.remove('playing'), 1200);
  }

  const label = document.getElementById('soundFreqLabel');
  if (label) label.textContent = `SYNTHESIZING: ${type.toUpperCase()}`;

  if (type === 'unlock') {
    // Sub bass punch + pneumatic release
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.4);
    gain.gain.setValueAtTime(0.6, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.4);

    // Click
    const click = ctx.createOscillator();
    const clickGain = ctx.createGain();
    click.type = 'triangle';
    click.frequency.setValueAtTime(800, now + 0.25);
    click.frequency.exponentialRampToValueAtTime(100, now + 0.35);
    clickGain.gain.setValueAtTime(0.4, now + 0.25);
    clickGain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    click.connect(clickGain);
    clickGain.connect(ctx.destination);
    click.start(now + 0.25);
    click.stop(now + 0.35);
  } else if (type === 'lock') {
    // Triple mechanical relay click
    [0, 0.1, 0.22].forEach((t, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(i === 2 ? 220 : 580 - i * 100, now + t);
      gain.gain.setValueAtTime(0.3, now + t);
      gain.gain.exponentialRampToValueAtTime(0.01, now + t + 0.08);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + t);
      osc.stop(now + t + 0.08);
    });
  } else if (type === 'access') {
    // Ascending electronic triad
    [440, 554.37, 659.25, 880].forEach((f, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now + i * 0.08);
      gain.gain.setValueAtTime(0.35, now + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.3);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.08);
      osc.stop(now + i * 0.08 + 0.3);
    });
  } else if (type === 'alarm') {
    // Warning siren
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(400, now);
    osc.frequency.linearRampToValueAtTime(800, now + 0.25);
    osc.frequency.linearRampToValueAtTime(400, now + 0.5);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.6);
  } else if (type === 'keystroke') {
    // Mechanical keystroke
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1200 + Math.random() * 300, now);
    osc.frequency.exponentialRampToValueAtTime(200, now + 0.06);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.06);
  } else if (type === 'ticker') {
    // Quartz 2FA pulse
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1760, now);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.04);
  } else if (type === 'drone') {
    // Binaural focus drone
    const osc1 = ctx.createOscillator();
    const osc2 = ctx.createOscillator();
    const gain = ctx.createGain();
    osc1.frequency.setValueAtTime(55, now);
    osc2.frequency.setValueAtTime(110, now);
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 2.0);
    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(ctx.destination);
    osc1.start(now);
    osc2.start(now);
    osc1.stop(now + 2.0);
    osc2.stop(now + 2.0);
  } else if (type === 'rain') {
    // Pink noise buffer
    const bufSize = ctx.sampleRate * 1.5;
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const data = buf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < bufSize; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      data[i] = (b0 + b1 + b2 + white * 0.5362) * 0.15;
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1200, now);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 1.5);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    noise.start(now);
    noise.stop(now + 1.5);
  }

  // Draw animated pulse on visualizer canvas
  if (soundVisualizerCtx) {
    const w = soundVisualizerCanvas.width;
    const h = soundVisualizerCanvas.height;
    soundVisualizerCtx.fillStyle = '#070a12';
    soundVisualizerCtx.fillRect(0, 0, w, h);
    soundVisualizerCtx.beginPath();
    for (let x = 0; x < w; x++) {
      const freq = type === 'drone' ? 0.02 : 0.08;
      const amp = Math.sin(x * freq) * (h / 3) * Math.sin((x / w) * Math.PI);
      const y = h / 2 + amp;
      if (x === 0) soundVisualizerCtx.moveTo(x, y); else soundVisualizerCtx.lineTo(x, y);
    }
    soundVisualizerCtx.strokeStyle = '#10b981';
    soundVisualizerCtx.lineWidth = 2.5;
    soundVisualizerCtx.shadowColor = '#10b981';
    soundVisualizerCtx.shadowBlur = 10;
    soundVisualizerCtx.stroke();
  }
}

function exportSoundWav(type) {
  // Render high-fidelity 44.1kHz WAV via OfflineAudioContext
  const sampleRate = 44100;
  const duration = type === 'drone' || type === 'rain' ? 2.0 : 0.8;
  const offlineCtx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, sampleRate * duration, sampleRate);

  const now = 0;
  if (type === 'access') {
    [440, 554.37, 659.25, 880].forEach((f, i) => {
      const osc = offlineCtx.createOscillator();
      const gain = offlineCtx.createGain();
      osc.frequency.setValueAtTime(f, now + i * 0.08);
      gain.gain.setValueAtTime(0.4, now + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.3);
      osc.connect(gain);
      gain.connect(offlineCtx.destination);
      osc.start(now + i * 0.08);
      osc.stop(now + i * 0.08 + 0.3);
    });
  } else {
    const osc = offlineCtx.createOscillator();
    const gain = offlineCtx.createGain();
    osc.frequency.setValueAtTime(type === 'alarm' ? 440 : 180, now);
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
    osc.connect(gain);
    gain.connect(offlineCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
  }

  offlineCtx.startRendering().then(renderedBuffer => {
    const wavBlob = audioBufferToWavBlob(renderedBuffer);
    const url = URL.createObjectURL(wavBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vault_${type}_${Date.now()}.wav`;
    a.click();
    toast(`✓ Exported ${type.toUpperCase()} WAV sound!`);
  });
}

function audioBufferToWavBlob(buffer) {
  const numOfChan = buffer.numberOfChannels;
  const length = buffer.length * numOfChan * 2 + 44;
  const out = new DataView(new ArrayBuffer(length));
  const channels = [];
  let sample = 0;
  let offset = 0;
  let pos = 0;

  function writeString(str) {
    for (let i = 0; i < str.length; i++) {
      out.setUint8(pos++, str.charCodeAt(i));
    }
  }

  writeString('RIFF');
  out.setUint32(pos, length - 8, true); pos += 4;
  writeString('WAVE');
  writeString('fmt ');
  out.setUint32(pos, 16, true); pos += 4;
  out.setUint16(pos, 1, true); pos += 2;
  out.setUint16(pos, numOfChan, true); pos += 2;
  out.setUint32(pos, buffer.sampleRate, true); pos += 4;
  out.setUint32(pos, buffer.sampleRate * 2 * numOfChan, true); pos += 4;
  out.setUint16(pos, numOfChan * 2, true); pos += 2;
  out.setUint16(pos, 16, true); pos += 2;
  writeString('data');
  out.setUint32(pos, length - pos - 4, true); pos += 4;

  for (let i = 0; i < buffer.numberOfChannels; i++) {
    channels.push(buffer.getChannelData(i));
  }

  while (offset < buffer.length) {
    for (let i = 0; i < numOfChan; i++) {
      sample = Math.max(-1, Math.min(1, channels[i][offset]));
      sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
      out.setInt16(pos, sample, true);
      pos += 2;
    }
    offset++;
  }

  return new Blob([out], { type: 'audio/wav' });
}

async function generateStoryAction() {
  if (isWritingStory) return;
  const genre = document.getElementById('storyGenre')?.value || 'Fiction';
  const tone = document.getElementById('storyTone')?.value || 'Immersive';
  const length = document.getElementById('storyLength')?.value || 'short';
  const chars = document.getElementById('storyCharacters')?.value.trim() || '';
  const setting = document.getElementById('storySetting')?.value.trim() || '';
  const premise = document.getElementById('storyPremise')?.value.trim();

  if (!premise) return toast('Please provide a plot hook or premise');

  const btn = document.getElementById('btnWriteStory');
  const outputEl = document.getElementById('storyOutputArea');
  isWritingStory = true;
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '✍️ Writing Story…';
  }

  if (outputEl) {
    outputEl.innerHTML = `
      <div class="story-config-card" style="text-align:center;padding:40px 20px;">
        <div style="font-size:32px;animation:pulseLive 1.5s infinite;">📖</div>
        <div style="font-size:16px;font-weight:700;margin-top:12px;">Crafting Your Narrative…</div>
        <div style="font-size:13px;color:var(--muted);margin-top:6px;">Weaving characters, atmosphere, and dialogue into a rich story.</div>
      </div>
    `;
  }

  const promptText = `Write an engaging, beautifully styled, creative normal story.
Genre: ${genre}
Tone: ${tone}
Length Target: ${length === 'flash' ? 'Approx 350 words' : length === 'detailed' ? 'Approx 1200 words' : 'Approx 700 words'}
${chars ? 'Characters: ' + chars : ''}
${setting ? 'Setting: ' + setting : ''}
Premise: ${premise}

Instructions:
1. Start with a compelling Title on the first line formatted as '# Title: [Story Title]'.
2. Craft vivid sensory details, distinct dialogue, and satisfying narrative arc.
3. Keep the content creative, compelling, and suitable for all audiences.`;

  try {
    const res = await fetch(API + '/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + masterKey
      },
      body: JSON.stringify({
        message: promptText,
        provider: currentAiProvider,
        model: currentAiModel
      })
    });

    const data = await res.json();
    let text = data.reply || '';

    // Extract title
    let title = 'The Journey Untold';
    const titleMatch = text.match(/^#?\s*Title:\s*(.*$)/im) || text.match(/^#\s+(.*$)/m);
    if (titleMatch) {
      title = titleMatch[1].replace(/[*#]/g, '').trim();
      text = text.replace(titleMatch[0], '').trim();
    }

    currentStoryData = {
      title,
      genre,
      tone,
      content: text,
      timestamp: new Date().toISOString()
    };

    toast('✓ Story successfully created!');
  } catch (err) {
    toast('Error generating story: ' + err.message);
  } finally {
    isWritingStory = false;
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '✨ Write Story';
    }
    const area = document.getElementById('storyOutputArea');
    if (area) area.innerHTML = renderStoryContentHtml();
  }
}

async function saveStoryToVaultNotes() {
  if (!currentStoryData) return;
  try {
    await api('POST', '/passwords', {
      title: 'Story: ' + currentStoryData.title,
      username: currentStoryData.genre,
      password: currentStoryData.tone,
      url: 'story://vault-studio',
      description: currentStoryData.content,

    });
    toast('✓ Story saved to your Vault Cards & Notes!');

async function saveStoryToDriveTxt() {
  if (!currentStoryData) return;
  try {
    toast('Saving story to Vault Drive…');
    const safeTitle = currentStoryData.title.replace(/[^a-zA-Z0-9_-]/g, '_').toLowerCase();
    const filename = `${safeTitle}_story.txt`;
    const fullText = `# ${currentStoryData.title}\nGenre: ${currentStoryData.genre}\nTone: ${currentStoryData.tone}\n\n${currentStoryData.content}`;
    const base64 = 'data:text/plain;base64,' + btoa(unescape(encodeURIComponent(fullText)));

    await api('POST', '/uploads', {
      filename,
      content: base64,
      mime_type: 'text/plain',
      item_type: 'file',
      item_id: 0
    });
    toast(`✓ Saved ${filename} to Vault Drive!`);
  } catch (err) {
    toast('Error uploading to drive: ' + err.message);
  }
}

async function zipAndShareStoryQr() {
  if (!currentStoryData) return;
  if (typeof JSZip === 'undefined') return toast('JSZip library loading…');

  try {
    toast('Creating compressed ZIP archive for story…');
    const zip = new JSZip();
    const safeTitle = currentStoryData.title.replace(/[^a-zA-Z0-9_-]/g, '_').toLowerCase();
    const fullText = `# ${currentStoryData.title}\nGenre: ${currentStoryData.genre}\nTone: ${currentStoryData.tone}\nDate: ${currentStoryData.timestamp}\n\n${currentStoryData.content}`;
    
    zip.file(`${safeTitle}.txt`, fullText);
    zip.file('README.txt', `Created by Vault Story Studio on Cloudflare.\nTitle: ${currentStoryData.title}\nGenre: ${currentStoryData.genre}`);

    const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 9 } });
    const reader = new FileReader();
    reader.onload = async () => {
      const base64 = reader.result;
      const filename = `${safeTitle}_story.zip`;
      
      // Upload ZIP to attachments
      const saved = await api('POST', '/uploads', {
        filename,
        content: base64,
        mime_type: 'application/zip',
        item_type: 'file',
        item_id: 0
      });

      const qrUrl = window.location.origin + `/api/attachments/raw/${saved.id}`;
      showCustomQrModal(`📦 Compressed ZIP Story Archive\nFilename: ${filename}\nDirect Link: ${qrUrl}`);
      toast('✓ Story ZIP created and QR code generated!');
    };
    reader.readAsDataURL(zipBlob);
  } catch (err) {
    toast('ZIP export error: ' + err.message);
  }
}

function copyStoryText() {
  if (!currentStoryData) return;
  copyText(`# ${currentStoryData.title}\n\n${currentStoryData.content}`);
  toast('Story copied to clipboard!');
}

function handleTtsPlay() {

  const voiceIdx = parseInt(document.getElementById('ttsVoiceSelect')?.value || '0', 10);
  const rate = parseFloat(document.getElementById('ttsRateSlider')?.value || '1.0');
  const pitch = parseFloat(document.getElementById('ttsPitchSlider')?.value || '1.0');

  speakText(text, null, { voiceIdx, rate, pitch });

async function loadTtsPreset(type) {
  const input = document.getElementById('ttsTextInput');
  if (!input) return;

  if (type === 'tasks') {
    const todos = await api('GET', '/todos');
    const pending = todos.filter(t => !t.completed);
    input.value = `Here is your vault task briefing. You have ${pending.length} active tasks. Top priorities are: ` + 
      pending.slice(0, 5).map((t, i) => `Number ${i + 1}: ${t.title}, due ${t.due_date || 'soon'}`).join('. ') + '.';
  } else if (type === 'audit') {
    const audit = await api('GET', '/audit');
    input.value = `Security audit report. Your overall vault protection score is ${audit.score || 85} percent. You have ${audit.passwords?.total || 0} credentials stored. Ensure all accounts have two-factor authentication and passwords of sixteen characters or more.`;
  }
  toast('Loaded text preset');
}

    let entries = null;
    try {
      // 1. First attempt via Cloudflare / Express server API endpoint
      const res = await fetch(API + '/dictionary/' + encodeURIComponent(word));
      if (res.ok) {
        entries = await res.json();
      } else if (res.status === 404) {
        throw new Error(`No definition found for "${word}". Try checking spelling or search a root word.`);
      }
    } catch (e) {
      if (e.message && e.message.includes('No definition found')) throw e;
      // 2. Direct client-side fallback to Free Dictionary API
      try {
        const fallbackRes = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`, {
          signal: AbortSignal.timeout(3000)
        });
        if (fallbackRes.ok) {
          entries = await fallbackRes.json();
        }
      } catch (_) {}

      // 3. Resilient client-side lexical fallback to Datamuse API
      if (!entries) {
        try {
          const dmRes = await fetch(`https://api.datamuse.com/words?sp=${encodeURIComponent(word)}&md=d&max=1`, {
            signal: AbortSignal.timeout(3000)
          });
          if (dmRes.ok) {
            const dmData = await dmRes.json();
            if (dmData && dmData[0] && Array.isArray(dmData[0].defs) && dmData[0].defs.length > 0) {
              const meaningsMap = {};
              const posNameMap = { adj: 'adjective', n: 'noun', v: 'verb', adv: 'adverb', u: 'general' };
              for (const defStr of dmData[0].defs) {
                const tabIdx = defStr.indexOf('\t');
                const posAbbr = tabIdx !== -1 ? defStr.slice(0, tabIdx).trim() : 'general';
                const defText = tabIdx !== -1 ? defStr.slice(tabIdx + 1).trim() : defStr.trim();
                const pos = posNameMap[posAbbr] || posAbbr;
                if (!meaningsMap[pos]) meaningsMap[pos] = { partOfSpeech: pos, definitions: [] };
                meaningsMap[pos].definitions.push({ definition: defText });
              }
              entries = [{
                word: dmData[0].word || word,
                phonetic: '',
                phonetics: [],
                meanings: Object.values(meaningsMap)
              }];
            }
          }
        } catch (_) {}
      }

      if (!entries) {
        throw new Error(`No definition found for "${word}".`);
      }
    }

    if (!Array.isArray(entries) || entries.length === 0) {
      throw new Error(`No definition found for "${word}".`);
    }

    currentDictData = entries[0];

    // Update search history
    if (!dictSearchHistory.includes(word)) {
      dictSearchHistory.unshift(word);
      if (dictSearchHistory.length > 20) dictSearchHistory.pop();
      try {
        localStorage.setItem('vault_dict_history', JSON.stringify(dictSearchHistory));
        fetch('/api/settings/set', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: 'vault_dict_history', value: dictSearchHistory })
        }).catch(() => {});
      } catch (_) {}
    }

    renderDictionaryResultHtml();
  } catch (err) {
    if (resultArea) {
      resultArea.innerHTML = `
        <div class="dict-card" style="text-align:center;padding:40px 20px;">
          <div style="font-size:36px;margin-bottom:10px;">🔍</div>
          <div style="font-size:16px;font-weight:700;color:var(--text);">Definition Not Found</div>
          <div style="font-size:13px;color:var(--muted);margin-top:6px;max-width:440px;margin-left:auto;margin-right:auto;">
            ${esc(err.message)}
          </div>
          <div style="margin-top:16px;">
            <button class="btn btn-secondary" onclick="speakText('${esc(word)}')">🗣️ Pronounce "${esc(word)}"</button>
          </div>
        </div>
      `;
    }
  } finally {
    if (btn) btn.disabled = false;
  }
}

function renderDictionaryResultHtml() {
  const resultArea = document.getElementById('dictResultArea');
  if (!resultArea || !currentDictData) return;

  const data = currentDictData;
  const word = data.word || currentDictWord;
  const phonetics = data.phonetics || [];
  
  // Find phonetic audio file if available
  let audioUrl = '';
  let phoneticText = data.phonetic || '';
  for (const p of phonetics) {
    if (p.text && !phoneticText) phoneticText = p.text;
    if (p.audio && !audioUrl) audioUrl = p.audio;
  }

  const meanings = data.meanings || [];

  let html = `
    <div class="dict-card">
      <!-- WORD HEADER -->
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--border);padding-bottom:16px;">

              🔊
            </button>
          </div>
          ${data.origin ? `<div style="font-size:12px;color:var(--muted);margin-top:6px;">Origin: ${esc(data.origin)}</div>` : ''}
        </div>

        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-primary" style="padding:6px 12px;font-size:12px;" onclick="saveDictWordToVault()">
            ➕ Save to Vocabulary Cards
          </button>
          <button class="btn btn-secondary" style="padding:6px 12px;font-size:12px;" onclick="copyDictionaryDefinition()">
            📋 Copy
          </button>
          <button class="btn btn-secondary" style="padding:6px 12px;font-size:12px;" onclick="speakDictionaryMeaning()">
            🗣️ Read Aloud
          </button>
        </div>
      </div>

      <!-- MEANINGS & DEFINITIONS -->
      <div style="display:flex;flex-direction:column;gap:16px;margin-top:16px;">
  `;

  meanings.forEach(m => {
    html += `
      <div>
        <div class="dict-pos-heading">
          <span>●</span>
          <span>${esc(m.partOfSpeech || 'General')}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px;">
    `;

    (m.definitions || []).slice(0, 5).forEach((d, idx) => {
      html += `
        <div class="dict-def-item">
          <div><strong style="color:var(--accent);margin-right:4px;">${idx + 1}.</strong> ${esc(d.definition)}</div>
          ${d.example ? `<div class="dict-example">“${esc(d.example)}”</div>` : ''}
          ${(d.synonyms && d.synonyms.length) ? `
            <div style="margin-top:6px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;">
              <span style="font-size:11px;color:var(--muted);">Synonyms:</span>
              ${d.synonyms.slice(0, 6).map(s => `<span class="dict-synonym-pill" onclick="searchDictWord('${esc(s)}')">${esc(s)}</span>`).join('')}
            </div>
          ` : ''}
        </div>
      `;
    });

    if (m.synonyms && m.synonyms.length) {
      html += `
        <div style="margin-top:8px;padding-left:12px;">
          <span style="font-size:12px;font-weight:600;color:var(--muted);">More Synonyms: </span>
          ${m.synonyms.slice(0, 10).map(s => `<span class="dict-synonym-pill" onclick="searchDictWord('${esc(s)}')">${esc(s)}</span>`).join('')}
        </div>
      `;
    }

    if (m.antonyms && m.antonyms.length) {
      html += `
        <div style="margin-top:4px;padding-left:12px;">
          <span style="font-size:12px;font-weight:600;color:var(--muted);">Antonyms: </span>
          ${m.antonyms.slice(0, 8).map(a => `<span class="dict-synonym-pill" style="border-color:rgba(239,68,68,0.4);" onclick="searchDictWord('${esc(a)}')">${esc(a)}</span>`).join('')}
        </div>
      `;
    }

    html += `</div></div>`;
  });

  html += `</div></div>`;
  resultArea.innerHTML = html;
}

function playDictionaryPronunciation(audioUrl, word) {
  if (audioUrl && audioUrl.startsWith('http')) {
    if (dictAudioElement) {
      dictAudioElement.pause();
      dictAudioElement = null;
    }
    dictAudioElement = new Audio(audioUrl);
    dictAudioElement.play().catch(() => {
      speakText(word);
    });
  } else {
    speakText(word);
  }
}

function speakDictionaryMeaning() {
  if (!currentDictData) return;
  const word = currentDictData.word || currentDictWord;
  const def = currentDictData.meanings?.[0]?.definitions?.[0]?.definition || '';
  speakText(`${word}. ${def}`);
}

async function saveDictWordToVault() {
  if (!currentDictData) return;
  const word = currentDictData.word || currentDictWord;
  const phonetic = currentDictData.phonetic || '';
  const def = currentDictData.meanings?.[0]?.definitions?.[0]?.definition || '';
  const example = currentDictData.meanings?.[0]?.definitions?.[0]?.example || '';

  try {
    await api('POST', '/passwords', {
      title: `Vocab: ${word.toUpperCase()}`,
      username: phonetic,
      password: word,
      url: 'dict://vocabulary',
      description: `Definition: ${def}\n${example ? 'Example: "' + example + '"' : ''}`,
      item_type: 'note'
    });
    toast(`✓ "${word}" saved to your Vault Vocabulary Notes!`);
  } catch (err) {
    toast('Failed to save word note: ' + err.message);
  }
}

function copyDictionaryDefinition() {
  if (!currentDictData) return;
  const word = currentDictData.word || currentDictWord;
  const textParts = [`${word.toUpperCase()}`];
  if (currentDictData.phonetic) textParts.push(currentDictData.phonetic);
  (currentDictData.meanings || []).forEach(m => {
    textParts.push(`\n[${m.partOfSpeech}]`);
    (m.definitions || []).forEach((d, i) => {
      textParts.push(`${i + 1}. ${d.definition}`);
      if (d.example) textParts.push(`   Example: "${d.example}"`);
    });
  });
  copyText(textParts.join('\n'));
  toast('Definition copied to clipboard!');
}

      if (isRadioPlaying) {
        // High-energy rhythmic audio simulation matching streaming pulse
        const freq1 = Math.sin(time * 3 + i * 0.4);
        const freq2 = Math.cos(time * 5 + i * 0.2);
        amp = (Math.abs(freq1 * 0.6 + freq2 * 0.4) * (h * 0.75) + 4) * radioVolume;
      } else {
        amp = 2; // Flat idle line
      }

      const x = i * (barWidth + 2);
      const y = h - amp;

      const grad = ctx.createLinearGradient(0, h, 0, 0);
      grad.addColorStop(0, '#10b981');
      grad.addColorStop(0.5, '#22d3ee');
      grad.addColorStop(1, '#7c6af7');

      ctx.fillStyle = grad;
      ctx.fillRect(x, y, barWidth, amp);
    }

    radioVisualizerAnim = requestAnimationFrame(draw);
  }

  if (radioVisualizerAnim) cancelAnimationFrame(radioVisualizerAnim);
  draw();
}

function playRadioStation(url, name, tags) {
  if (radioAudio) {
    radioAudio.pause();
    radioAudio.src = '';
  }

  currentStation = { url_resolved: url, name, tags: tags || 'Online Radio' };
  radioAudio = new Audio(url);
  radioAudio.volume = isRadioMuted ? 0 : radioVolume;

  toast(`Connecting to ${name}…`);
  radioAudio.play().then(() => {
    isRadioPlaying = true;
    toast(`✓ Streaming: ${name}`);
    updateRadioUi();
  }).catch(err => {
    isRadioPlaying = false;
    toast(`Stream playback error: ${err.message}. Trying next mirror…`);
    updateRadioUi();
  });

  radioAudio.onplaying = () => {
    isRadioPlaying = true;
    updateRadioUi();
  };
  radioAudio.onpause = () => {
    isRadioPlaying = false;
    updateRadioUi();
  };
  radioAudio.onerror = () => {
    isRadioPlaying = false;
    updateRadioUi();
  };
}

function toggleRadioPlay() {
  if (!radioAudio) {
    if (CURATED_RADIO_STATIONS[0]) {
      const s = CURATED_RADIO_STATIONS[0];
      playRadioStation(s.url_resolved, s.name, s.tags);
    }
    return;
  }

  if (isRadioPlaying) {
    radioAudio.pause();
    isRadioPlaying = false;
  } else {
    radioAudio.play().then(() => {
      isRadioPlaying = true;
    }).catch(err => toast('Play error: ' + err.message));
  }
  updateRadioUi();
}

function stopRadio() {
  if (radioAudio) {
    radioAudio.pause();
    radioAudio.currentTime = 0;
  }
  isRadioPlaying = false;
  currentStation = null;
  updateRadioUi();
  toast('Radio stopped');
}

let voiceRecognition = null;
let isVoiceListening = false;
let voiceTalkingMode = false;
let isSpeaking = false;

function initVoiceRecognition() {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) return null;

  if (!voiceRecognition) {
    voiceRecognition = new SpeechRec();
    voiceRecognition.continuous = false;
    voiceRecognition.interimResults = true;
    voiceRecognition.lang = 'en-US';

    voiceRecognition.onstart = () => {
      isVoiceListening = true;
      updateVoiceUiState();
    };

    voiceRecognition.onresult = (event) => {
      let transcript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }

      const input = document.getElementById('chatInput');
      if (input) input.value = transcript;

      // If sentence is final, send immediately
      if (event.results[0].isFinal) {
        isVoiceListening = false;
        updateVoiceUiState();
        sendChatMessage();
      }
    };

    voiceRecognition.onerror = (event) => {
      console.warn('Speech recognition event:', event.error);
      isVoiceListening = false;
      updateVoiceUiState();
    };

    voiceRecognition.onend = () => {
      isVoiceListening = false;
      updateVoiceUiState();
    };
  }
  return voiceRecognition;
}

function toggleVoiceTalkingMode() {
  voiceTalkingMode = !voiceTalkingMode;
  toast(voiceTalkingMode ? '🎙️ Hands-Free Voice Conversation: ON' : 'Voice Conversation: OFF');
  updateVoiceUiState();

  if (voiceTalkingMode) {
    startVoiceListening();
  } else {
    stopVoiceListening();
  }
}

function startVoiceListening() {
  const rec = initVoiceRecognition();
  if (!rec) {
    toast('Web Speech Recognition is not supported in this browser. You can still use Read Aloud.');
    return;
  }
  try {
    rec.start();
  } catch (_) {}
}

function stopVoiceListening() {
  if (voiceRecognition) {
    try {
      voiceRecognition.stop();
    } catch (_) {}
  }
  isVoiceListening = false;
  updateVoiceUiState();
}

function toggleMicButton() {
  if (isVoiceListening) {
    stopVoiceListening();
  } else {
    startVoiceListening();
  }
}

function updateVoiceUiState() {
  const micBtn = document.getElementById('chatMicBtn');
  const talkToggleBtn = document.getElementById('voiceTalkingModeToggle');
  const chatInput = document.getElementById('chatInput');

  if (micBtn) {
    if (isVoiceListening) {
      micBtn.classList.add('active-listening');
      micBtn.innerHTML = '🔴';
      micBtn.title = 'Listening… Click to stop';
      if (chatInput && !chatInput.value) chatInput.placeholder = 'Listening for your voice…';
    } else {
      micBtn.classList.remove('active-listening');
      micBtn.innerHTML = '🎙️';
      micBtn.title = 'Click to speak';
    }
  }

  if (talkToggleBtn) {
    talkToggleBtn.style.background = voiceTalkingMode ? 'rgba(239, 68, 68, 0.15)' : 'var(--surface2)';
    talkToggleBtn.style.borderColor = voiceTalkingMode ? 'var(--red)' : 'var(--border)';
    talkToggleBtn.style.color = voiceTalkingMode ? 'var(--red)' : 'var(--text)';
    talkToggleBtn.innerHTML = voiceTalkingMode ? '🔴 Voice Talk: ON' : '🎙️ Voice Talk: OFF';
  }
}

function speakText(rawText, onEndCallback, options = {}) {
  if (!window.speechSynthesis) {
    toast('Speech synthesis is not supported on this device');
    return;
  }

  window.speechSynthesis.cancel(); // Stop prior speech
  isSpeaking = true;

  // Clean Markdown & code blocks for clean, natural speech
  let cleanText = (rawText || '')
    .replace(/```action:[\s\S]*?```/g, '')
    .replace(/```[\s\S]*?```/g, '')
    .replace(/[#*`_~]/g, '')
    .replace(/https?:\/\/\S+/g, '')
    .trim();

  if (!cleanText) return;

  const utterance = new SpeechSynthesisUtterance(cleanText.substring(0, 3000));
  utterance.rate = options.rate || 1.0;
  utterance.pitch = options.pitch || 1.0;

  const voices = window.speechSynthesis.getVoices();
  if (options.voiceIdx !== undefined && voices[options.voiceIdx]) {
    utterance.voice = voices[options.voiceIdx];
  } else {
    // Prefer friendly English voice
    const naturalVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha')));
    if (naturalVoice) utterance.voice = naturalVoice;
  }

  utterance.onend = () => {
    isSpeaking = false;
    if (onEndCallback) onEndCallback();
  };

  utterance.onerror = () => {
    isSpeaking = false;
  };

  window.speechSynthesis.speak(utterance);
}

function stopSpeaking() {
  if (window.speechSynthesis) {
    window.speechSynthesis.cancel();
  }
  isSpeaking = false;
  toast('Narration stopped');
}

function speakChatMessage(idx) {
  const msg = chatMessages[idx];
  if (!msg) return;
  speakText(msg.text);
}

// Speak assistant response in Voice Talking mode and restart listening
function speakVoiceAssistantResponse(text) {
  speakText(text, () => {
    if (voiceTalkingMode) {
      setTimeout(() => {
        startVoiceListening();
      }, 400);
    }
  });
}

function renderWorldClockCards() {
  return WORLD_CLOCK_ZONES.map(z => {
    let targetDate = new Date();
    if (worldClockReferenceHour !== null) {
      targetDate.setHours(worldClockReferenceHour, 0, 0, 0);
    }

    const timeStr = targetDate.toLocaleTimeString('en-US', {
      timeZone: z.tz,
      hour: '2-digit',
      minute: '2-digit',
      second: worldClockReferenceHour === null ? '2-digit' : undefined,
      hour12: false
    });

    const dateStr = targetDate.toLocaleDateString('en-US', {
      timeZone: z.tz,
      weekday: 'short',
      month: 'short',
      day: 'numeric'
    });

    const hourInTz = parseInt(targetDate.toLocaleTimeString('en-US', { timeZone: z.tz, hour: 'numeric', hour12: false }));
    const isDay = hourInTz >= 6 && hourInTz < 18;
    const isBusinessHours = hourInTz >= 9 && hourInTz < 18;

    return `
      <div style="background:var(--surface);border:1px solid ${isBusinessHours ? 'rgba(34,197,94,0.4)' : 'var(--border)'};border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;">
