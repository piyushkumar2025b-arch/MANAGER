<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0f0f13"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Vault — Passwords & Tasks</title>
<meta name="description" content="Secure vault for managing passwords, tasks, and attachments with a master password."/>
<meta property="og:title" content="Vault — Passwords & Tasks"/>
<meta property="og:description" content="Secure vault for managing passwords, tasks, and attachments with a master password."/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --surface: #18181f;
    --surface2: #21212c;
    --border: #2a2a38;
    --text: #e8e8f0;
    --muted: #6b6b82;
    --accent: #7c6af7;
    --accent-glow: rgba(124,106,247,0.18);
    --red: #f04f5a;
    --red-bg: rgba(240,79,90,0.12);
    --orange: #f59e0b;
    --orange-bg: rgba(245,158,11,0.12);
    --green: #22c55e;
    --green-bg: rgba(34,197,94,0.1);
    --radius: 12px;
    --radius-sm: 8px;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; }

  /* LOCK SCREEN */
  #lockScreen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1000; gap: 24px; padding: 32px;
  }
  .lock-icon { font-size: 56px; }
  .lock-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .lock-sub { color: var(--muted); font-size: 14px; text-align: center; max-width: 260px; line-height: 1.5; }
  .input-wrap {
    position: relative; width: 100%; max-width: 320px;
  }
  .lock-input {
    width: 100%; padding: 14px 44px 14px 18px;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-size: 16px;
    font-family: 'JetBrains Mono', monospace; letter-spacing: 1.5px;
    outline: none; text-align: center;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .lock-input:focus { border-color: var(--accent); }
  .lock-pw-toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; font-size: 16px;
    color: var(--muted); padding: 4px; display: flex; align-items: center; justify-content: center;
    transition: color 0.2s;
  }
  .lock-pw-toggle:hover { color: var(--text); }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }
  .shake-error {
    animation: shake 0.35s ease-in-out;
    border-color: var(--red) !important;
    box-shadow: 0 0 0 3px var(--red-bg);
  }
  .lock-btn {
    width: 100%; max-width: 320px; padding: 14px;
    background: var(--accent); border: none; border-radius: var(--radius);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: opacity 0.2s;
  }
  .lock-btn:hover { opacity: 0.88; }
  .lock-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .lock-note { font-size: 12px; color: var(--muted); text-align: center; max-width: 320px; line-height: 1.5; }

  /* APP */
  #app { display: none; flex-direction: column; height: 100dvh; overflow: hidden; }
  #app.visible { display: flex; }

  /* TOP BAR */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 12px; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .topbar-actions { display: flex; gap: 8px; }

  /* TABS */
  .tabs {
    display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0;
    padding: 0 20px; gap: 0;
  }
  .tab {
    padding: 12px 20px; font-size: 14px; font-weight: 500; color: var(--muted);
    border: none; background: none; cursor: pointer; position: relative;
    transition: color 0.2s;
  }
  .tab.active { color: var(--text); }
  .tab.active::after {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 2px; background: var(--accent); border-radius: 2px 2px 0 0;
  }

  /* MAIN CONTENT */
  .main { flex: 1; overflow-y: auto; padding: 16px 20px 100px; }

  /* SEARCH */
  .search-wrap { margin-bottom: 16px; position: relative; }
  .search-input {
    width: 100%; padding: 11px 16px 11px 40px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); font-size: 14px;
    outline: none; transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; pointer-events: none; }

  /* CARDS */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 10px; overflow: hidden;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: var(--accent); }
  .card.urgent { border-color: var(--red); background: linear-gradient(135deg, var(--surface), #1a1218); }
  .card.soon { border-color: var(--orange); }
  .card.done { opacity: 0.5; }

  .card-header {
    display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
    cursor: pointer;
  }
  .card-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
  .card-info { flex: 1; min-width: 0; }
  .card-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-sub { font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .badge {
    padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 600;
  }
  .badge-red { background: var(--red-bg); color: var(--red); }
  .badge-orange { background: var(--orange-bg); color: var(--orange); }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-accent { background: var(--accent-glow); color: var(--accent); }

  .card-expanded { padding: 0 16px 14px; border-top: 1px solid var(--border); }
  .card-desc { font-size: 13px; color: var(--muted); margin-top: 12px; line-height: 1.6; }
  .card-field { margin-top: 10px; }
  .card-field label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .card-field .val { font-family: 'JetBrains Mono', monospace; font-size: 13px; margin-top: 4px; word-break: break-all; display: flex; align-items: center; gap: 8px; }
  .copy-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer; color: var(--muted); transition: color 0.2s; }
  .copy-btn:hover { color: var(--text); }
  .pw-hidden { filter: blur(5px); cursor: pointer; transition: filter 0.2s; }
  .pw-hidden:hover { filter: blur(0); }

  /* ATTACHMENTS */
  .attach-section { margin-top: 12px; }
  .attach-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .attach-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .attach-chip {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; font-size: 12px;
    cursor: pointer; transition: border-color 0.2s;
  }
  .attach-chip:hover { border-color: var(--accent); }
  .attach-del { color: var(--muted); margin-left: 4px; font-size: 14px; }
  .attach-del:hover { color: var(--red); }
  .attach-upload {
    display: flex; align-items: center; gap: 6px;
    background: none; border: 1px dashed var(--border);
    border-radius: 6px; padding: 5px 10px; font-size: 12px; color: var(--muted);
    cursor: pointer; transition: border-color 0.2s, color 0.2s;
  }
  .attach-upload:hover { border-color: var(--accent); color: var(--accent); }

  /* ICON BUTTONS */
  .icon-btn {
    width: 32px; height: 32px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--surface2);
    color: var(--muted); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, color 0.2s;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn.danger:hover { border-color: var(--red); color: var(--red); }

  /* FAB */
  .fab {
    position: fixed; bottom: 24px; right: 20px;
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--accent); border: none;
    font-size: 24px; color: #fff; cursor: pointer;
    box-shadow: 0 4px 24px rgba(124,106,247,0.4);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
    z-index: 100;
  }
  .fab:hover { transform: scale(1.08); box-shadow: 0 6px 32px rgba(124,106,247,0.5); }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 500; opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); border-radius: 20px 20px 0 0;
    width: 100%; max-width: 600px; padding: 24px 24px 40px;
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    max-height: 90dvh; overflow-y: auto;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
  .modal-close { float: right; background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }

  /* FORM */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 11px 14px;
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); font-size: 14px;
    font-family: inherit; outline: none; transition: border-color 0.2s;
    resize: vertical;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
  .field select option { background: var(--surface2); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .submit-btn {
    width: 100%; padding: 14px; background: var(--accent);
    border: none; border-radius: var(--radius); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px;
    transition: opacity 0.2s;
  }
  .submit-btn:hover { opacity: 0.88; }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; line-height: 1.5; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface2); border: 1px solid var(--border);
    padding: 10px 20px; border-radius: 30px; font-size: 13px;
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; z-index: 9999; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* CHECKBOX */
  .check-btn {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
    background: none; cursor: pointer; flex-shrink: 0; margin-top: 1px;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    transition: border-color 0.2s, background 0.2s;
  }
  .check-btn.checked { background: var(--green); border-color: var(--green); }

  /* DUE DATE indicator */
  .due-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; margin-top: 4px; }

  .section-header { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; margin: 16px 0 8px; font-weight: 600; }

  /* AI ASSISTANT CHAT */
  .chat-container {
    display: flex; flex-direction: column; height: calc(100dvh - 120px);
    max-width: 820px; margin: 0 auto;
  }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 12px 4px 16px; display: flex; flex-direction: column; gap: 14px;
  }
  .chat-bubble {
    max-width: 88%; padding: 14px 18px; border-radius: var(--radius);
    font-size: 14px; line-height: 1.6; word-break: break-word;
  }
  .chat-bubble.user {
    align-self: flex-end; background: var(--accent); color: #fff;
    border-bottom-right-radius: 2px;
  }
  .chat-bubble.bot {
    align-self: flex-start; background: var(--surface); border: 1px solid var(--border);
    border-bottom-left-radius: 2px; color: var(--text);
  }
  .chat-bubble pre {
    background: var(--surface2); padding: 10px 14px; border-radius: 6px;
    overflow-x: auto; margin: 8px 0; font-family: 'JetBrains Mono', monospace; font-size: 12px;
    border: 1px solid var(--border);
  }
  .chat-bubble code {
    background: var(--surface2); padding: 2px 6px; border-radius: 4px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
  }
  .chat-action-card {
    margin-top: 10px; padding: 12px 14px; background: var(--surface2);
    border: 1px solid var(--accent); border-radius: 8px; display: flex;
    flex-direction: column; gap: 8px;
  }
  .chat-action-btn {
    background: var(--accent); border: none; color: #fff; padding: 8px 14px;
    border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: opacity 0.2s;
  }
  .chat-action-btn:hover { opacity: 0.88; }
  .chat-suggestions {
    display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; flex-shrink: 0;
  }
  .chat-chip {
    white-space: nowrap; background: var(--surface); border: 1px solid var(--border);
    padding: 7px 13px; border-radius: 20px; font-size: 12px; color: var(--text);
    cursor: pointer; transition: border-color 0.2s, background 0.2s; flex-shrink: 0;
  }
  .chat-chip:hover { border-color: var(--accent); background: var(--surface2); }
  .chat-input-bar {
    display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid var(--border); flex-shrink: 0;
  }
  .chat-input {
    flex: 1; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-size: 14px; outline: none;
    transition: border-color 0.2s;
  }
  .chat-input:focus { border-color: var(--accent); }
  .chat-send {
    padding: 12px 20px; background: var(--accent); border: none; border-radius: var(--radius);
    color: #fff; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s;
  }
  .chat-send:hover { opacity: 0.88; }

  /* CLOUDFLARE HUB */
  .cf-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 12px;
  }
  .cf-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .cf-card-header {
    display: flex; align-items: center; justify-content: space-between;
  }
  .cf-badge {
    background: var(--green-bg); color: var(--green); padding: 3px 8px; border-radius: 12px;
    font-size: 11px; font-weight: 600;
  }
  .cf-btn {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 9px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; transition: border-color 0.2s, color 0.2s;
  }
  .cf-btn:hover { border-color: var(--accent); color: #fff; }
  .cf-btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cf-btn-primary:hover { opacity: 0.88; }

  /* TASK STATS & FILTERS */
  .task-stats-bar {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px;
  }
  .task-stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 8px 12px; text-align: center;
  }
  .task-stat-val { font-size: 17px; font-weight: 700; color: var(--text); }
  .task-stat-lbl { font-size: 10px; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 1px; }

  .task-filter-row {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px;
  }
  .filter-pill {
    padding: 4px 12px; border-radius: 16px; font-size: 12px; font-weight: 500;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    cursor: pointer; white-space: nowrap; transition: all 0.2s;
  }
  .filter-pill:hover { border-color: var(--accent); color: var(--text); }
  .filter-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .category-pill {
    padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.4px; display: inline-block;
  }

  /* SUBTASKS CHECKLIST */
  .subtasks-section { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .subtasks-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
  }
  .subtasks-title { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; }
  .subtask-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    background: var(--surface2); border-radius: 6px; margin-bottom: 5px; font-size: 13px;
  }
  .subtask-checkbox {
    width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--border);
    background: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #fff; flex-shrink: 0;
  }
  .subtask-checkbox.checked { background: var(--green); border-color: var(--green); }
  .subtask-text { flex: 1; word-break: break-word; }
  .subtask-text.done { text-decoration: line-through; color: var(--muted); }
  .subtask-del { background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; padding: 2px 4px; }
  .subtask-del:hover { color: var(--red); }
  .subtask-add-row { display: flex; gap: 6px; margin-top: 8px; }
  .subtask-add-input {
    flex: 1; padding: 6px 10px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 12px; outline: none;
  }
  .subtask-add-input:focus { border-color: var(--accent); }
  .subtask-add-btn {
    padding: 6px 12px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 12px; cursor: pointer;
  }
  .subtask-add-btn:hover { border-color: var(--accent); color: var(--accent); }
  .ai-breakdown-btn {
    padding: 4px 9px; background: rgba(124,106,247,0.12); border: 1px solid var(--accent);
    border-radius: 6px; color: var(--accent); font-size: 11px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px; transition: background 0.2s;
  }
  .ai-breakdown-btn:hover { background: rgba(124,106,247,0.22); }

  /* AI ASSISTANT TOOLBAR */
  .ai-top-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-sm); margin-bottom: 12px; flex-wrap: wrap;
  }
  .ai-select {
    padding: 6px 10px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 12px; outline: none; cursor: pointer;
  }
  .ai-select:focus { border-color: var(--accent); }
  .ai-provider-badge {
    font-size: 11px; padding: 2px 7px; border-radius: 10px; font-weight: 600;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lockScreen">
  <div class="lock-icon">🔐</div>
  <div class="lock-title">Vault</div>
  <div class="lock-sub">Your credentials & tasks are protected by your master password.</div>
  
  <div class="input-wrap">
    <input class="lock-input" type="password" id="masterPw" placeholder="Master password" autocomplete="current-password" autofocus/>
    <button type="button" class="lock-pw-toggle" onclick="toggleLockPwVisibility()" title="Show/Hide password">👁️</button>
  </div>

  <div id="lockError" style="color: var(--red); font-size: 13px; font-weight: 500; display: none; text-align: center; max-width: 320px; margin-top: -12px;"></div>

  <div id="turnstileWidget" style="width: 100%; max-width: 320px; display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span>🛡️</span>
      <span id="turnstileLabel">Cloudflare Turnstile</span>
    </div>
    <span id="turnstileStatus" style="font-size: 11px; color: var(--green); font-weight: 600; cursor: pointer;" onclick="verifyTurnstile()">✓ Human Verified</span>
  </div>

  <button class="lock-btn" id="unlockBtn" onclick="unlock()">Unlock Vault</button>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-title">🔐 Vault</div>
    <div class="topbar-actions">
      <button class="icon-btn" onclick="switchTab('assistant')" title="AI Copilot">🤖</button>
      <button class="icon-btn" onclick="switchTab('cloudflare')" title="Cloudflare Hub">☁️</button>
      <button class="icon-btn" onclick="lockApp()" title="Lock">🔒</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('todos')" id="tab-todos">✅ Tasks</button>
    <button class="tab" onclick="switchTab('passwords')" id="tab-passwords">🔑 Passwords</button>
    <button class="tab" onclick="switchTab('assistant')" id="tab-assistant">🤖 AI Assistant</button>
    <button class="tab" onclick="switchTab('cloudflare')" id="tab-cloudflare">☁️ Cloudflare Hub</button>
  </div>

  <div class="main" id="mainContent">
    <!-- dynamic content -->
  </div>
</div>

<button class="fab" id="fabBtn" onclick="openAdd()">＋</button>
<div class="toast" id="toast"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div id="modalContent"></div>
  </div>
</div>

<input type="file" id="fileInput" style="display:none" multiple onchange="handleFileUpload(event)"/>

<script>
const API = '/api';
let masterKey = '';
let currentTab = 'todos';
let expandedCards = new Set();
let attachments = {}; // cache: "type-id" -> []
let pendingAttachItem = null;

// ---- LOCK / UNLOCK ----
async function unlock() {
  const input = document.getElementById('masterPw');
  const errorEl = document.getElementById('lockError');
  const btn = document.getElementById('unlockBtn');
  const pw = input.value.trim();

  if (errorEl) errorEl.style.display = 'none';

  if (!pw) {
    showLockError('Please enter your master password');
    return;
  }

  // Turnstile verification check if enabled
  if (localStorage.getItem('vault_turnstile_enabled') === 'true' && !turnstileVerified) {
    showLockError('Please complete Turnstile human verification first');
    return;
  }

  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Verifying...';
  }

  try {
    const res = await fetch(`${API}/auth/verify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const data = await res.json();

    if (res.ok && data.success) {
      masterKey = pw;
      sessionStorage.setItem('vault_master_key', pw);
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('app').classList.add('visible');
      loadTab();
      toast('Vault unlocked');
    } else {
      showLockError(data.error || 'Incorrect master password. Please try again.');
    }
  } catch (err) {
    // Fallback if offline
    if (pw === 'BRAWLSTARSBRAWLSTARS1234') {
      masterKey = pw;
      sessionStorage.setItem('vault_master_key', pw);
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('app').classList.add('visible');
      loadTab();
      toast('Vault unlocked');
    } else {
      showLockError('Incorrect master password. Please try again.');
    }
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = 'Unlock Vault';
    }
  }
}

function showLockError(msg) {
  const input = document.getElementById('masterPw');
  const errorEl = document.getElementById('lockError');
  if (errorEl) {
    errorEl.textContent = '❌ ' + msg;
    errorEl.style.display = 'block';
  }
  input.classList.add('shake-error');
  setTimeout(() => input.classList.remove('shake-error'), 400);
  input.focus();
  input.select();
  toast(msg);
}

function toggleLockPwVisibility() {
  const input = document.getElementById('masterPw');
  if (input.type === 'password') {
    input.type = 'text';
  } else {
    input.type = 'password';
  }
}

document.getElementById('masterPw').addEventListener('keydown', e => {
  if (e.key === 'Enter') unlock();
});

function lockApp() {
  masterKey = '';
  sessionStorage.removeItem('vault_master_key');
  expandedCards.clear();
  document.getElementById('app').classList.remove('visible');
  document.getElementById('lockScreen').style.display = 'flex';
  document.getElementById('masterPw').value = '';
  const errorEl = document.getElementById('lockError');
  if (errorEl) errorEl.style.display = 'none';
  toast('Vault locked');
}

// Auto-restore session if previously unlocked
window.addEventListener('DOMContentLoaded', async () => {
  const savedKey = sessionStorage.getItem('vault_master_key');
  if (savedKey) {
    try {
      const res = await fetch(`${API}/auth/verify`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: savedKey })
      });
      const data = await res.json();
      if (res.ok && data.success) {
        masterKey = savedKey;
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('app').classList.add('visible');
        loadTab();
      }
    } catch (_) {}
  }
});

// ---- TABS ----
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const activeTabEl = document.getElementById('tab-' + tab);
  if (activeTabEl) activeTabEl.classList.add('active');
  loadTab();
}

async function loadTab() {
  const content = document.getElementById('mainContent');
  const fab = document.getElementById('fabBtn');
  if (fab) {
    fab.style.display = (currentTab === 'todos' || currentTab === 'passwords') ? 'flex' : 'none';
  }

  if (currentTab === 'todos') {
    content.innerHTML = '<div style="color:var(--muted);padding:40px 0;text-align:center">Loading…</div>';
    await renderTodos();
  } else if (currentTab === 'passwords') {
    content.innerHTML = '<div style="color:var(--muted);padding:40px 0;text-align:center">Loading…</div>';
    await renderPasswords();
  } else if (currentTab === 'assistant') {
    renderAssistant();
  } else if (currentTab === 'cloudflare') {
    await renderCloudflareHub();
  }
}

// ---- API ----
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + masterKey } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  if (r.status === 401 && !path.startsWith('/auth/')) {
    lockApp();
    showLockError('Session expired. Please enter master password.');
    throw new Error('Unauthorized');
  }
  return r.json();
}

// ---- TODOS ----
let todoSearchFilter = '';
let todoCategoryFilter = 'All';
let todoStatusFilter = 'All'; // 'All', 'Pending', 'Completed', 'Overdue'

function getCategoryStyle(cat) {
  const c = (cat || 'General').toLowerCase();
  switch (c) {
    case 'security': return { bg: 'rgba(239, 68, 68, 0.15)', color: 'var(--red)', border: 'rgba(239, 68, 68, 0.3)' };
    case 'dev': return { bg: 'rgba(124, 106, 247, 0.15)', color: 'var(--accent)', border: 'rgba(124, 106, 247, 0.3)' };
    case 'work': return { bg: 'rgba(59, 130, 246, 0.15)', color: '#3b82f6', border: 'rgba(59, 130, 246, 0.3)' };
    case 'personal': return { bg: 'rgba(16, 185, 129, 0.15)', color: 'var(--green)', border: 'rgba(16, 185, 129, 0.3)' };
    default: return { bg: 'var(--surface2)', color: 'var(--muted)', border: 'var(--border)' };
  }
}

async function renderTodos() {
  const content = document.getElementById('mainContent');
  const todos = await api('GET', '/todos');
  const now = new Date();

  // Parse subtasks safely
  const processed = todos.map(t => {
    let subtasks = [];
    if (typeof t.subtasks === 'string' && t.subtasks.trim()) {
      try { subtasks = JSON.parse(t.subtasks); } catch (_) { subtasks = []; }
    } else if (Array.isArray(t.subtasks)) {
      subtasks = t.subtasks;
    }
    return { ...t, subtasks };
  });

  // Calculate stats
  const totalCount = processed.length;
  const pendingCount = processed.filter(t => !t.completed).length;
  const completedCount = processed.filter(t => t.completed).length;
  const overdueCount = processed.filter(t => !t.completed && t.due_date && getDueDiff(t.due_date) < 0).length;

  // Filter list
  const filtered = processed.filter(t => {
    const matchesSearch = !todoSearchFilter || 
      t.title.toLowerCase().includes(todoSearchFilter) || 
      (t.description||'').toLowerCase().includes(todoSearchFilter) ||
      (t.category||'').toLowerCase().includes(todoSearchFilter);

    const matchesCategory = todoCategoryFilter === 'All' || 
      (t.category || 'General').toLowerCase() === todoCategoryFilter.toLowerCase();

    const isOverdue = !t.completed && t.due_date && getDueDiff(t.due_date) < 0;
    const matchesStatus = todoStatusFilter === 'All' ||
      (todoStatusFilter === 'Pending' && !t.completed) ||
      (todoStatusFilter === 'Completed' && t.completed) ||
      (todoStatusFilter === 'Overdue' && isOverdue);

    return matchesSearch && matchesCategory && matchesStatus;
  });

  const pending = filtered.filter(t => !t.completed);
  const done = filtered.filter(t => t.completed);

  const categories = ['All', 'Work', 'Personal', 'Security', 'Dev', 'General'];
  const statuses = ['All', 'Pending', 'Completed', 'Overdue'];

  let html = `
    <!-- TASK STATS OVERVIEW -->
    <div class="task-stats-bar">
      <div class="task-stat-card">
        <div class="task-stat-val">${totalCount}</div>
        <div class="task-stat-lbl">Total</div>
      </div>
      <div class="task-stat-card">
        <div class="task-stat-val" style="color:var(--accent)">${pendingCount}</div>
        <div class="task-stat-lbl">Pending</div>
      </div>
      <div class="task-stat-card">
        <div class="task-stat-val" style="color:var(--green)">${completedCount}</div>
        <div class="task-stat-lbl">Done</div>
      </div>
      <div class="task-stat-card">
        <div class="task-stat-val" style="color:${overdueCount > 0 ? 'var(--red)' : 'var(--muted)'}">${overdueCount}</div>
        <div class="task-stat-lbl">Overdue</div>
      </div>
    </div>

    <!-- SEARCH & ACTION BAR -->
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" placeholder="Search tasks, categories, notes…" oninput="setTodoSearch(this.value.toLowerCase())" value="${esc(todoSearchFilter)}"/>
      ${completedCount > 0 ? `<button class="filter-pill" style="border-color:var(--red);color:var(--red);background:var(--surface);" onclick="clearCompletedTodos()" title="Clear all completed tasks">🧹 Clear Done (${completedCount})</button>` : ''}
    </div>

    <!-- CATEGORY FILTER PILLS -->
    <div class="task-filter-row">
      <span style="font-size:11px;color:var(--muted);font-weight:600;display:flex;align-items:center;margin-right:2px;">CAT:</span>
      ${categories.map(cat => `
        <button class="filter-pill ${todoCategoryFilter.toLowerCase() === cat.toLowerCase() ? 'active' : ''}" onclick="setTodoCategory('${cat}')">
          ${cat}
        </button>
      `).join('')}
    </div>

    <!-- STATUS FILTER PILLS -->
    <div class="task-filter-row" style="margin-top:-4px;">
      <span style="font-size:11px;color:var(--muted);font-weight:600;display:flex;align-items:center;margin-right:2px;">VIEW:</span>
      ${statuses.map(st => `
        <button class="filter-pill ${todoStatusFilter.toLowerCase() === st.toLowerCase() ? 'active' : ''}" onclick="setTodoStatus('${st}')">
          ${st}
        </button>
      `).join('')}
    </div>
  `;

  if (pending.length === 0 && done.length === 0) {
    html += `<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">No tasks found matching your filters.<br>Tap + to create a task or clear filters.</div></div>`;
  }

  if (pending.length) {
    html += '<div class="section-header">Pending (' + pending.length + ')</div>';
    html += pending.map(t => todoCard(t, now)).join('');
  }
  if (done.length) {
    html += '<div class="section-header">Completed (' + done.length + ')</div>';
    html += done.map(t => todoCard(t, now)).join('');
  }

  content.innerHTML = html;
}

function setTodoSearch(val) {
  todoSearchFilter = val;
  renderTodos();
}

function setTodoCategory(cat) {
  todoCategoryFilter = cat;
  renderTodos();
}

function setTodoStatus(st) {
  todoStatusFilter = st;
  renderTodos();
}

function getDueDiff(due) {
  if (!due) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(due); d.setHours(0,0,0,0);
  return Math.round((d - now) / 86400000);
}

function dueBadge(due, completed) {
  if (!due || completed) return '';
  const diff = getDueDiff(due);
  if (diff < 0) return `<span class="badge badge-red">⚠ Overdue ${Math.abs(diff)}d</span>`;
  if (diff === 0) return `<span class="badge badge-red">🔴 Due today</span>`;
  if (diff <= 2) return `<span class="badge badge-orange">🟠 ${diff}d left</span>`;
  return `<span class="badge badge-accent">📅 ${diff}d</span>`;
}

function todoCard(t, now) {
  const urgent = !t.completed && t.due_date && getDueDiff(t.due_date) <= 0;
  const soon = !t.completed && t.due_date && getDueDiff(t.due_date) <= 2 && getDueDiff(t.due_date) > 0;
  const cls = t.completed ? 'done' : urgent ? 'urgent' : soon ? 'soon' : '';
  const expanded = expandedCards.has('todo-' + t.id);
  const priColor = t.priority === 'high' ? 'var(--red)' : t.priority === 'medium' ? 'var(--orange)' : 'var(--muted)';
  const catStyle = getCategoryStyle(t.category);

  // Subtask progress
  const subtasks = t.subtasks || [];
  const completedSubtasks = subtasks.filter(s => s.done).length;
  const subtasksBadge = subtasks.length > 0 ? 
    `<span class="badge" style="background:var(--surface2);color:var(--text);font-size:11px;">☑ ${completedSubtasks}/${subtasks.length}</span>` : '';

  return `<div class="card ${cls}" id="card-todo-${t.id}">
    <div class="card-header">
      <button class="check-btn ${t.completed ? 'checked' : ''}" onclick="toggleTodo(${t.id}, ${!t.completed})">${t.completed ? '✓' : ''}</button>
      <div class="card-info" onclick="toggleExpand('todo', ${t.id})">
        <div class="card-title" style="${t.completed ? 'text-decoration:line-through' : ''}">${esc(t.title)}</div>
        <div class="card-sub" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          <span class="category-pill" style="background:${catStyle.bg};color:${catStyle.color};border:1px solid ${catStyle.border};">${esc(t.category || 'General')}</span>
          ${dueBadge(t.due_date, t.completed)}
          <span style="color:${priColor};font-size:11px;font-weight:600;text-transform:capitalize;">${t.priority}</span>
          ${subtasksBadge}
        </div>
      </div>
      <div class="card-actions">
        <button class="icon-btn" onclick="editTodo(${t.id})" title="Edit">✏️</button>
        <button class="icon-btn danger" onclick="deleteTodo(${t.id})" title="Delete">🗑️</button>
      </div>
    </div>
    ${expanded ? `<div class="card-expanded">
      ${t.description ? `<div class="card-desc">${esc(t.description)}</div>` : ''}

      <!-- SUBTASKS / CHECKLIST SECTION -->
      <div class="subtasks-section">
        <div class="subtasks-header">
          <div class="subtasks-title">Subtasks (${completedSubtasks}/${subtasks.length})</div>
          <button class="ai-breakdown-btn" id="btn-breakdown-${t.id}" onclick="breakdownWithAi(${t.id})">
            <span>🤖</span> AI Breakdown
          </button>
        </div>
        
        <div class="subtask-list" id="subtasks-list-${t.id}">
          ${subtasks.map(s => `
            <div class="subtask-item">
              <button class="subtask-checkbox ${s.done ? 'checked' : ''}" onclick="toggleSubtaskItem(${t.id}, '${esc(s.id)}')">
                ${s.done ? '✓' : ''}
              </button>
              <span class="subtask-text ${s.done ? 'done' : ''}">${esc(s.title)}</span>
              <button class="subtask-del" onclick="deleteSubtaskItem(${t.id}, '${esc(s.id)}')">✕</button>
            </div>
          `).join('')}
        </div>

        <div class="subtask-add-row">
          <input type="text" class="subtask-add-input" id="subtask-input-${t.id}" placeholder="Add subtask… (press Enter)" onkeydown="if(event.key==='Enter') addSubtaskItem(${t.id})"/>
          <button class="subtask-add-btn" onclick="addSubtaskItem(${t.id})">＋ Add</button>
        </div>
      </div>

      <!-- ATTACHMENTS SECTION -->
      <div class="attach-section" style="margin-top:14px;">
        <div class="attach-title">Attachments</div>
        <div class="attach-list" id="attach-todo-${t.id}">Loading…</div>
        <button class="attach-upload" onclick="startAttach('todo', ${t.id})">📎 Attach file</button>
      </div>
    </div>` : ''}
  </div>`;
}

async function toggleTodo(id, completed) {
  const todos = await api('GET', '/todos');
  const t = todos.find(x => x.id === id);
  if (!t) return;
  await api('PUT', '/todos/' + id, { ...t, completed });
  renderTodos();
}

async function deleteTodo(id) {
  if (!confirm('Delete this task?')) return;
  await api('DELETE', '/todos/' + id);
  expandedCards.delete('todo-' + id);
  renderTodos();
  toast('Task deleted');
}

async function clearCompletedTodos() {
  if (!confirm('Are you sure you want to delete all completed tasks?')) return;
  try {
    const res = await api('DELETE', '/todos/completed');
    toast(`Cleared ${res.deleted || 0} completed tasks`);
    renderTodos();
  } catch (err) {
    toast('Error clearing completed: ' + err.message);
  }
}

// Subtask item handlers
async function toggleSubtaskItem(todoId, subtaskId) {
  const todos = await api('GET', '/todos');
  const t = todos.find(x => x.id === todoId);
  if (!t) return;
  let subtasks = [];
  try { subtasks = typeof t.subtasks === 'string' ? JSON.parse(t.subtasks) : (t.subtasks || []); } catch (_) { subtasks = []; }
  
  const sub = subtasks.find(s => s.id === subtaskId);
  if (sub) {
    sub.done = !sub.done;
    await api('PUT', '/todos/' + todoId, { ...t, subtasks });
    renderTodos();
  }
}

async function deleteSubtaskItem(todoId, subtaskId) {
  const todos = await api('GET', '/todos');
  const t = todos.find(x => x.id === todoId);
  if (!t) return;
  let subtasks = [];
  try { subtasks = typeof t.subtasks === 'string' ? JSON.parse(t.subtasks) : (t.subtasks || []); } catch (_) { subtasks = []; }
  
  subtasks = subtasks.filter(s => s.id !== subtaskId);
  await api('PUT', '/todos/' + todoId, { ...t, subtasks });
  renderTodos();
}

async function addSubtaskItem(todoId) {
  const input = document.getElementById(`subtask-input-${todoId}`);
  if (!input) return;
  const title = input.value.trim();
  if (!title) return;

  const todos = await api('GET', '/todos');
  const t = todos.find(x => x.id === todoId);
  if (!t) return;
  let subtasks = [];
  try { subtasks = typeof t.subtasks === 'string' ? JSON.parse(t.subtasks) : (t.subtasks || []); } catch (_) { subtasks = []; }
  
  subtasks.push({
    id: 'sub_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
    title,
    done: false
  });

  await api('PUT', '/todos/' + todoId, { ...t, subtasks });
  input.value = '';
  renderTodos();
}

async function breakdownWithAi(todoId) {
  const btn = document.getElementById(`btn-breakdown-${todoId}`);
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span>⏳</span> Breaking down…';
  }
  try {
    const res = await api('POST', `/todos/${todoId}/breakdown`);
    if (res.subtasks && res.subtasks.length > 0) {
      toast(`Generated ${res.subtasks.length} subtasks with ${res.provider || 'AI'}!`);
      renderTodos();
    } else {
      toast('Could not generate breakdown: ' + (res.error || 'Empty response'));
    }
  } catch (err) {
    toast('Breakdown failed: ' + err.message);
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = '<span>🤖</span> AI Breakdown';
    }
  }
}

// ---- PASSWORDS ----
async function renderPasswords(filter = '') {
  const content = document.getElementById('mainContent');
  const passwords = await api('GET', '/passwords');

  const filtered = passwords.filter(p =>
    !filter || p.title.toLowerCase().includes(filter) || (p.username||'').toLowerCase().includes(filter) || (p.url||'').toLowerCase().includes(filter)
  );

  let html = `<div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" placeholder="Search passwords…" oninput="renderPasswords(this.value.toLowerCase())" value="${filter}"/>
  </div>`;

  if (filtered.length === 0) {
    html += `<div class="empty"><div class="empty-icon">🔑</div><div class="empty-text">No passwords saved yet.<br>Tap + to add one.</div></div>`;
  } else {
    html += filtered.map(p => passwordCard(p)).join('');
  }

  content.innerHTML = html;
}

function passwordCard(p) {
  const expanded = expandedCards.has('password-' + p.id);
  return `<div class="card" id="card-password-${p.id}">
    <div class="card-header" onclick="toggleExpand('password', ${p.id})">
      <div class="card-icon">🔑</div>
      <div class="card-info">
        <div class="card-title">${esc(p.title)}</div>
        <div class="card-sub">${p.username ? esc(p.username) : p.url ? esc(p.url) : 'No username'}</div>
      </div>
      <div class="card-actions">
        <button class="icon-btn" onclick="event.stopPropagation();editPassword(${p.id})">✏️</button>
        <button class="icon-btn danger" onclick="event.stopPropagation();deletePassword(${p.id})">🗑️</button>
      </div>
    </div>
    ${expanded ? `<div class="card-expanded">
      ${p.username ? `<div class="card-field"><label>Username</label><div class="val">${esc(p.username)}<button class="copy-btn" onclick="copyText('${esc(p.username)}')">Copy</button></div></div>` : ''}
      <div class="card-field"><label>Password</label>
        <div class="val"><span class="pw-hidden" title="Hover to reveal">${esc(p.password)}</span><button class="copy-btn" onclick="copyText('${p.password.replace(/'/g,"\\'")}')">Copy</button></div>
      </div>
      ${p.url ? `<div class="card-field"><label>URL</label><div class="val"><a href="${esc(p.url)}" target="_blank" style="color:var(--accent)">${esc(p.url)}</a></div></div>` : ''}
      ${p.description ? `<div class="card-desc">${esc(p.description)}</div>` : ''}
      <div class="attach-section">
        <div class="attach-title">Attachments</div>
        <div class="attach-list" id="attach-password-${p.id}">Loading…</div>

// ---- ATTACHMENTS ----
async function loadAttachments(type, id) {
  const container = document.getElementById(`attach-${type}-${id}`);
  if (!container) return;
  const list = await api('GET', `/attachments/${type}/${id}`);
  if (!list.length) { container.innerHTML = '<span style="color:var(--muted);font-size:12px">No files attached</span>'; return; }
  container.innerHTML = list.map(a => `
    <div class="attach-chip" onclick="downloadAttach(${a.id}, '${esc(a.filename)}')">
      📎 ${esc(a.filename)}
      <span class="attach-del" onclick="event.stopPropagation();deleteAttach(${a.id},'${type}',${id})">✕</span>
    </div>
  `).join('');
}

function startAttach(type, id) {
  pendingAttachItem = { type, id };
  document.getElementById('fileInput').click();
}

async function handleFileUpload(event) {
  const files = Array.from(event.target.files);
  if (!files.length || !pendingAttachItem) return;
  for (const file of files) {
    const content = await toBase64(file);
    await api('POST', '/attachments', {
      item_type: pendingAttachItem.type,
      item_id: pendingAttachItem.id,
      filename: file.name,
      content,
      mime_type: file.type
    });
  }
  loadAttachments(pendingAttachItem.type, pendingAttachItem.id);
  event.target.value = '';
  toast(`${files.length} file(s) attached`);
}

function toBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function downloadAttach(id, filename) {
  const data = await api('GET', `/attachments/download/${id}`);
  const a = document.createElement('a');
  a.href = data.content;
  a.download = filename;
  a.click();
}

async function deleteAttach(id, type, itemId) {
  if (!confirm('Remove attachment?')) return;
  await api('DELETE', `/attachments/delete/${id}`);
  loadAttachments(type, itemId);
  toast('Attachment removed');
}

async function saveTodo() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) return toast('Title is required');
  const body = {
    title,
    description: document.getElementById('f-desc').value.trim(),
    due_date: document.getElementById('f-due').value || null,
    priority: document.getElementById('f-priority').value,
    category: document.getElementById('f-category').value || 'General',
    completed: 0
  };
  if (editingId) {
    const todos = await api('GET', '/todos');
    const t = todos.find(x => x.id === editingId);
    let existingSubtasks = t?.subtasks;
    if (typeof existingSubtasks === 'string') {
      try { existingSubtasks = JSON.parse(existingSubtasks); } catch (_) { existingSubtasks = []; }
    }
    await api('PUT', '/todos/' + editingId, { 
      ...body, 
      completed: t?.completed || 0,
      subtasks: existingSubtasks || []
    });
    toast('Task updated');
  } else {
    await api('POST', '/todos', { ...body, subtasks: [] });
    toast('Task added');
  }
  closeModal();
  renderTodos();
}

async function savePassword() {
  const title = document.getElementById('f-title').value.trim();
  const password = document.getElementById('f-password').value.trim();
  if (!title || !password) return toast('Title and password are required');
  const body = {
    title,
    username: document.getElementById('f-username').value.trim(),
    password,
    url: document.getElementById('f-url').value.trim(),
    description: document.getElementById('f-desc').value.trim()
  };
  if (editingId) {
    await api('PUT', '/passwords/' + editingId, body);
    toast('Password updated');
  } else {
    await api('POST', '/passwords', body);
    toast('Password saved');
  }
  closeModal();
  renderPasswords();
}

function renderChatMessagesHtml() {
  return chatMessages.map(msg => {
    const isBot = msg.role === 'bot';

    const providerMeta = isBot && msg.provider ? `
      <div style="font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--accent);margin-bottom:4px;display:flex;align-items:center;gap:4px;">

    ` : '';
    return `<div class="chat-bubble ${isBot ? 'bot' : 'user'}">${providerMeta}${parsedText}</div>`;
  }).join('');
}

function formatBotMessage(rawText) {
  let text = rawText || '';

  const taskActions = [];
  const pwActions = [];

  text = text.replace(/```action:task\s*([\s\S]*?)```/g, (match, jsonStr) => {
    try {
      const data = JSON.parse(jsonStr.trim());
      taskActions.push(data);
      return `[[TASK_ACTION_${taskActions.length - 1}]]`;
    } catch(e) {
      return match;
    }
  });

  text = text.replace(/```action:password\s*([\s\S]*?)```/g, (match, jsonStr) => {
    try {
      const data = JSON.parse(jsonStr.trim());
      pwActions.push(data);
      return `[[PW_ACTION_${pwActions.length - 1}]]`;
    } catch(e) {
      return match;
    }
  });

  text = esc(text);

  text = text.replace(/^### (.*$)/gim, '<div style="font-weight:700;font-size:15px;color:var(--text);margin:8px 0 4px;">$1</div>');
  text = text.replace(/^## (.*$)/gim, '<div style="font-weight:700;font-size:16px;color:var(--text);margin:10px 0 6px;">$1</div>');
  text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  text = text.replace(/```([a-z]*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  text = text.replace(/^\s*[-•]\s+(.*$)/gim, '<div style="display:flex;gap:6px;margin:3px 0;"><span>•</span><span>$1</span></div>');
  text = text.replace(/\n\n/g, '<div style="height:8px"></div>').replace(/\n/g, '<br>');

  taskActions.forEach((task, idx) => {
    const cardHtml = `
      <div class="chat-action-card">
        <div style="font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;">
          <span>📋</span><span>${esc(task.title || 'New Task')}</span>
        </div>
        ${task.description ? `<div style="font-size:12px;color:var(--muted);">${esc(task.description)}</div>` : ''}
        <div style="font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;">
          <span>Priority: <strong style="color:var(--text);text-transform:capitalize;">${esc(task.priority||'medium')}</strong></span>
          ${task.due_date ? `<span>Due: <strong style="color:var(--accent);">${esc(task.due_date)}</strong></span>` : ''}
          ${task.category ? `<span>Category: <strong style="color:var(--text);">${esc(task.category)}</strong></span>` : ''}
        </div>
        <button class="chat-action-btn" onclick="applyChatTask('${encodeURIComponent(JSON.stringify(task))}')">
          ➕ Add to Tasks
        </button>
      </div>
    `;
    text = text.replace(`[[TASK_ACTION_${idx}]]`, cardHtml);
  });

  pwActions.forEach((pw, idx) => {
    const cardHtml = `
      <div class="chat-action-card">
        <div style="font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;">
          <span>🔑</span><span>${esc(pw.title || 'New Password')}</span>
        </div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--accent);word-break:break-all;background:var(--surface);padding:6px 10px;border-radius:4px;border:1px solid var(--border);">
          ${esc(pw.password || '')}
        </div>
        ${pw.username ? `<div style="font-size:11px;color:var(--muted);">Username: ${esc(pw.username)}</div>` : ''}
        <div style="display:flex;gap:6px;margin-top:2px;">
          <button class="copy-btn" onclick="copyText('${esc(pw.password || '')}')">📋 Copy</button>
          <button class="chat-action-btn" style="flex:1" onclick="applyChatPassword('${encodeURIComponent(JSON.stringify(pw))}')">
            ➕ Save to Passwords
          </button>
        </div>
      </div>
    `;
    text = text.replace(`[[PW_ACTION_${idx}]]`, cardHtml);
  });

  return text;
}

function scrollChatToBottom() {
  const el = document.getElementById('chatMessages');
  if (el) el.scrollTop = el.scrollHeight;
}

async function sendSuggestion(text) {
  const input = document.getElementById('chatInput');
  if (input) input.value = text;
  await sendChatMessage();
}

async function sendChatMessage() {
  if (isChatSending) return;
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('chatSendBtn');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;

  chatMessages.push({ role: 'user', text });
  input.value = '';
  isChatSending = true;
  if (sendBtn) {
    sendBtn.disabled = true;
    sendBtn.style.opacity = '0.6';
  }

  chatMessages.push({ role: 'bot', text: 'Thinking…', provider: currentAiProvider, model: currentAiModel });
  const messagesEl = document.getElementById('chatMessages');
  if (messagesEl) messagesEl.innerHTML = renderChatMessagesHtml();
  scrollChatToBottom();

  try {
    const res = await fetch(API + '/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + masterKey
      },
      body: JSON.stringify({ 
        message: text, 
        history: chatMessages.slice(0, -2),
        provider: currentAiProvider,
        model: currentAiModel
      })
    });
    const data = await res.json();
    const lastMsg = chatMessages[chatMessages.length - 1];
    lastMsg.text = data.reply || 'No response received from Assistant.';
    lastMsg.provider = data.provider || currentAiProvider;
    lastMsg.model = data.model || currentAiModel;
  } catch (err) {
    chatMessages[chatMessages.length - 1].text = '⚠️ Sorry, an error occurred while connecting to the assistant: ' + err.message;
  } finally {
    isChatSending = false;
    if (sendBtn) {
      sendBtn.disabled = false;
      sendBtn.style.opacity = '1';
    }
    if (messagesEl) messagesEl.innerHTML = renderChatMessagesHtml();
    scrollChatToBottom();
  }
}

async function applyChatTask(encoded) {
  try {
    const task = JSON.parse(decodeURIComponent(encoded));
    await api('POST', '/todos', {
      title: task.title,
      description: task.description || '',
      due_date: task.due_date || null,
      priority: task.priority || 'medium',
      category: task.category || 'General',
      subtasks: task.subtasks || [],
      completed: 0
    });
    toast('Task added to Vault!');
  } catch(e) {
    toast('Failed to add task: ' + e.message);
  }
}

async function applyChatPassword(encoded) {
  try {
    const pw = JSON.parse(decodeURIComponent(encoded));
    await api('POST', '/passwords', {
      title: pw.title,
      username: pw.username || '',
      password: pw.password,
      url: pw.url || '',
      description: pw.description || ''
    });
    toast('Password saved to Vault!');
  } catch(e) {
    toast('Failed to save password: ' + e.message);
  }
}

// Password change modal & handler
function openChangePasswordModal() {
  openModal(`
    <div class="modal-title">🔐 Change Master Password</div>
    <div class="form-group">
      <label>Current Master Password</label>
      <input type="password" id="changeCurrentPw" placeholder="Current password" />
    </div>
    <div class="form-group">
      <label>New Master Password</label>
      <input type="password" id="changeNewPw" placeholder="Minimum 4 characters" />
    </div>
    <div class="form-group">
      <label>Confirm New Password</label>
      <input type="password" id="changeConfirmPw" placeholder="Re-enter new password" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitChangePassword()">Update Password</button>
    </div>
  `);
}

async function submitChangePassword() {
  const current = document.getElementById('changeCurrentPw').value.trim();
  const next = document.getElementById('changeNewPw').value.trim();
  const confirm = document.getElementById('changeConfirmPw').value.trim();

  if (!current) return toast('Please enter your current password');
  if (!next || next.length < 4) return toast('New password must be at least 4 characters');
  if (next !== confirm) return toast('New passwords do not match');

  try {
    const res = await fetch(`${API}/auth/change-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ currentPassword: current, newPassword: next })
    });
    const data = await res.json();
    if (res.ok && data.success) {
      masterKey = next;
      sessionStorage.setItem('vault_master_key', next);
      closeModal();
      toast('Master password updated successfully!');
    } else {
      toast('❌ ' + (data.error || 'Failed to update master password'));
    }
  } catch (err) {
    toast('Error updating password: ' + err.message);
  }
}

// Backup & Export Functions
async function exportD1Sql() {
  try {
    const data = await api('GET', '/backup/export');
    const blob = new Blob([data.sql], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vault_d1.sql';
    a.click();
    URL.revokeObjectURL(url);
    toast('D1 SQL script downloaded!');
  } catch (err) {
    toast('Export failed: ' + err.message);
  }
}

async function exportJsonBackup() {
  try {
    const data = await api('GET', '/backup/export');
    const blob = new Blob([JSON.stringify({ passwords: data.passwords, todos: data.todos, exported_at: data.timestamp }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `vault_backup_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('JSON backup downloaded!');
  } catch (err) {
    toast('Export failed: ' + err.message);
  }
}

function triggerImport() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const json = JSON.parse(reader.result);
        const res = await api('POST', '/backup/import', json);
        toast(`Imported ${res.importedPasswords || 0} passwords & ${res.importedTodos || 0} tasks!`);
        await renderCloudflareHub();
      } catch (err) {
        toast('Import failed: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function toggleTurnstile(enabled) {
  localStorage.setItem('vault_turnstile_enabled', enabled ? 'true' : 'false');
  const widget = document.getElementById('turnstileWidget');
  if (widget) {
    widget.style.display = enabled ? 'flex' : 'none';

  toast(enabled ? 'Turnstile protection enabled' : 'Turnstile protection disabled');
}
